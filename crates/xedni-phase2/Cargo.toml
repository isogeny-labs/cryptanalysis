[package]
name = "xedni-phase2"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/isogeny-labs/cryptanalysis"
description = "Xedni Phase 2 native Rust investigation: Cayley-Bacharach cubic pencils, nodal Bezout curves, and CH-L4 public small-height lift selector"
publish = false

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
