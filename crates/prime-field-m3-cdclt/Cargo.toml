[package]
name = "prime-field-m3-cdclt"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/isogeny-labs/cryptanalysis"
description = "Arity-three disjoint-window chained-S3 prime-field CDCL(Fp) propagator, compact binary selector, and independent explanation/DRAT(T) verifier"
publish = false

[lib]
name = "prime_field_m3_cdclt"
path = "src/lib.rs"

[[bin]]
name = "m3-cdclt-screen"
path = "src/bin/m3-cdclt-screen.rs"

[[bin]]
name = "m3-static-cnf"
path = "src/bin/m3-static-cnf.rs"

[features]
default = []
