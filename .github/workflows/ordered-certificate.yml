name: Ordered independent certificate
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/ordered-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round15/**'
      - 'experiments/groebner-perf-20260924/round14/**'
      - 'experiments/groebner-perf-20260924/round4/**'
      - 'experiments/pdp-scaling/**'
      - '.github/workflows/ordered-certificate.yml'
permissions:
  contents: read
concurrency:
  group: ordered-certificate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certificate:
    name: Ordered certificate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cxx: g++}
          - {os: macos-latest, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924 experiments/pdp-scaling
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build independent decoder variants and unchanged producer
        run: |
          python experiments/groebner-perf-20260924/round4/build.py
          python experiments/groebner-perf-20260924/round14/build.py
          python experiments/groebner-perf-20260924/round15/build.py
      - name: Exact certificates, malformed inputs, concurrency and replay
        run: python -m unittest discover -s experiments/groebner-perf-20260924/round15 -p 'test_*.py' -v
      - name: Audit complete-query evidence
        run: python experiments/groebner-perf-20260924/round15/verify_evidence.py
