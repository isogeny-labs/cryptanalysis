name: Groebner F6 affine target exactness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/groebner-f6-affine.yml'
      - 'experiments/groebner-f6-affine-target-20261009/**'
      - 'experiments/groebner-f6-boundary-compact-20261009/**'
      - 'experiments/groebner-f6-message-20261009/**'
      - 'experiments/groebner-f6-prepared-20261009/**'
      - 'experiments/groebner-f6-packed-20261009/**'
      - 'experiments/groebner-f6-20261008/**'
      - 'experiments/pdp-scaling/gf2n.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/groebner-f6-affine.yml'
      - 'experiments/groebner-f6-affine-target-20261009/**'
      - 'experiments/groebner-f6-boundary-compact-20261009/**'
      - 'experiments/groebner-f6-message-20261009/**'
      - 'experiments/groebner-f6-prepared-20261009/**'
      - 'experiments/groebner-f6-packed-20261009/**'
      - 'experiments/groebner-f6-20261008/**'
      - 'experiments/pdp-scaling/gf2n.py'
permissions:
  contents: read
jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-f6-affine-target-20261009 experiments/groebner-f6-boundary-compact-20261009
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build source-bound separator chain
        run: |
          python experiments/groebner-f6-packed-20261009/build.py
          python experiments/groebner-f6-prepared-20261009/build.py
          python experiments/groebner-f6-message-20261009/build.py
          python experiments/groebner-f6-boundary-compact-20261009/build.py
          python experiments/groebner-f6-affine-target-20261009/build.py
      - name: Direct polynomial, UBSan, and 512-target exactness
        run: |
          mkdir -p f6-affine-evidence
          python experiments/groebner-f6-affine-target-20261009/test_affine.py | tee f6-affine-evidence/tests.log
          python experiments/groebner-f6-affine-target-20261009/semantic_replay.py --output f6-affine-evidence/semantic.json
      - name: Paired complete Boolean-query panel
        run: python experiments/groebner-f6-affine-target-20261009/profile.py --output f6-affine-evidence/profile --reps 5
      - name: Retain exact outputs and build receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groebner-f6-affine-${{ matrix.os }}
          path: |
            f6-affine-evidence
            experiments/groebner-f6-packed-20261009/build/receipt.json
            experiments/groebner-f6-prepared-20261009/build/receipt.json
            experiments/groebner-f6-message-20261009/build/receipt.json
            experiments/groebner-f6-boundary-compact-20261009/build/receipt.json
            experiments/groebner-f6-affine-target-20261009/build/receipt.json
          if-no-files-found: warn
