name: CT29 horizontal seven exact-map audit
on:
  push:
    branches:
      - research/ct29-horizontal-seven-cycles-20261111
    paths:
      - 'experiments/chained-transfer-reference/ct29/**'
      - 'experiments/chained-transfer-reference/ct32/**'
      - 'experiments/chained-transfer-reference/ct33/**'
      - 'experiments/chained-transfer-reference/ct34/**'
      - 'experiments/chained-transfer-reference/ct35/**'
      - 'experiments/chained-transfer-reference/ct36/**'
      - '.github/workflows/ct29-horizontal-seven-audit.yml'
  pull_request:
    paths:
      - 'experiments/chained-transfer-reference/ct29/**'
      - 'experiments/chained-transfer-reference/ct32/**'
      - 'experiments/chained-transfer-reference/ct33/**'
      - 'experiments/chained-transfer-reference/ct34/**'
      - 'experiments/chained-transfer-reference/ct35/**'
      - 'experiments/chained-transfer-reference/ct36/**'
      - '.github/workflows/ct29-horizontal-seven-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check exact rational-function and group identities
        run: |
          python3 -B experiments/chained-transfer-reference/ct29/audit_rational_maps_stdlib.py
          python3 -B experiments/chained-transfer-reference/ct29/audit_geometric_seven_stdlib.py
          python3 -O -B experiments/chained-transfer-reference/ct29/audit_geometric_seven_stdlib.py
          python3 -B experiments/chained-transfer-reference/ct29/audit_transported_two_torsion_stdlib.py
          python3 -O -B experiments/chained-transfer-reference/ct29/audit_transported_two_torsion_stdlib.py
          python3 -B experiments/chained-transfer-reference/ct32/ct32_frobenius49.py
          python3 -O -B experiments/chained-transfer-reference/ct32/ct32_frobenius49.py
          go run experiments/chained-transfer-reference/ct32/ct32_frobenius49_independent.go
          python3 -B experiments/chained-transfer-reference/ct33/ct33_cyclic49_kernel.py
          python3 -O -B experiments/chained-transfer-reference/ct33/ct33_cyclic49_kernel.py
          go run experiments/chained-transfer-reference/ct33/ct33_cyclic49_independent.go
          python3 -B experiments/chained-transfer-reference/ct34/ct34_direct49_audit.py
          python3 -O -B experiments/chained-transfer-reference/ct34/ct34_direct49_audit.py
          python3 -B experiments/chained-transfer-reference/ct35/ct35_cost_oracle.py > /tmp/ct35.stdout
          python3 -O -B experiments/chained-transfer-reference/ct35/ct35_cost_oracle.py > /tmp/ct35.optimized
          diff -u /tmp/ct35.stdout /tmp/ct35.optimized
          cat /tmp/ct35.stdout
          go run experiments/chained-transfer-reference/ct35/ct35_analytic_independent.go
          python3 -B experiments/chained-transfer-reference/ct36/ct36_dual49_oracle.py > /tmp/ct36.stdout
          python3 -O -B experiments/chained-transfer-reference/ct36/ct36_dual49_oracle.py > /tmp/ct36.optimized
          diff -u /tmp/ct36.stdout /tmp/ct36.optimized
          cat /tmp/ct36.stdout
