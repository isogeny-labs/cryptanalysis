name: prime-j0-radix943-corner-certificate

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-radix943-corner-certificate.yml"
      - "experiments/prime-j0-radix943-corner-certificate-20261012/**"
      - "experiments/prime-j0-radix943-digit-cover-20261012/**"
      - "experiments/prime-j0-radix943-termination-20261012/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Pinned Lean reciprocal-corner certificate
    runs-on: main
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit every reported theorem
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix943-corner-certificate-20261012/check.py --check
