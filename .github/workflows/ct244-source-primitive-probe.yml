name: CT244 exact-source C169 C13 D primitive probe
on:
  pull_request:
    paths:
      - 'experiments/chained-transfer-public-target/norm-point-reuse-01/ct244_primitive_probe.py'
      - 'experiments/chained-transfer-public-target/norm-point-reuse-01/CT244_PRIMITIVE_PRICING_PROTOCOL.md'
      - '.github/workflows/ct244-source-primitive-probe.yml'
permissions:
  contents: read
jobs:
  pinned-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experiments/chained-transfer-public-target/fixed-jacobian-chain-evaluator-01
            experiments/chained-transfer-public-target/norm-point-reuse-01
      - name: Python compile and exact-original mutation rejection
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/chained-transfer-public-target
          python3 -m py_compile "$root/norm-point-reuse-01/ct244_primitive_probe.py"
          python3 -S "$root/norm-point-reuse-01/ct244_primitive_probe.py" --original "$root/fixed-jacobian-chain-evaluator-01" --self-test
          python3 -O -S "$root/norm-point-reuse-01/ct244_primitive_probe.py" --original "$root/fixed-jacobian-chain-evaluator-01" --self-test
      - name: Create separate guarded Rust package and parse with rustfmt
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/chained-transfer-public-target
          python3 -S "$root/norm-point-reuse-01/ct244_primitive_probe.py" \
            --original "$root/fixed-jacobian-chain-evaluator-01" \
            --out "$root/fixed-jacobian-chain-priced-01" > /tmp/ct244-receipt.json
          rustfmt --edition 2021 --config skip_children=true --emit stdout "$root/fixed-jacobian-chain-priced-01/src/lib.rs" > /dev/null
          python3 -S - <<'PY'
          import json
          from pathlib import Path
          d=Path('experiments/chained-transfer-public-target/fixed-jacobian-chain-priced-01')
          r=json.loads((d/'CT244_SOURCE_RECEIPT.json').read_text())
          assert r['source_blob']=='8016634385d76207b23a3eb3a4dae9b0366ac68d'
          assert len(r['clock_slots']) == 7
          assert r['measurements'] is None
          s=(d/'src/lib.rs').read_text()
          assert s.count('ct244_record(')==3
          assert 'if ep(n.norm(&entry.class)?) != entry.norm {' in s
          assert 'CT244_PRIMITIVE_TIMING' in s
          print('CT244_SOURCE_GUARD_PASS seven slots; no native timing')
          PY
      - name: Scope
        run: echo "Source-only and rustfmt parsing; does not attest native compilation, all 695-record parity, primitive pricing, physical timing or PCC."
