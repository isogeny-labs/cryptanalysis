name: cloud
# The Runpod worker fleet, the Modal job runner and the Modal workers (cloud/).
# Nothing here talks to Runpod, Modal or Cursor; the tests run the job runner
# locally, and the Modal client is installed only so its definitions import.
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'ecc2k130/scripts/fetch_cuda.sh', '.github/workflows/cloud.yml']
  pull_request:
    branches: [main]
    paths: ['cloud/**', 'ecc2k130/scripts/fetch_cuda.sh', '.github/workflows/cloud.yml']
# A new commit supersedes runs for this PR or branch; manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 ecc2k130
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Modal client
        run: pip install 'modal>=1.0'
      - name: Install the taskq client
        # For the example-spec schema tests in cloud/tests/test_taskq_job.py.
        # They skip (and nothing else changes) if the install fails.
        run: |
          python -m pip install "taskq @ git+https://github.com/aburan28/crypto.git#subdirectory=taskq" \
            || echo "::warning::taskq could not be installed; the example-spec schema tests will skip"
      - name: Unit tests
        run: python -m unittest discover -s cloud/tests -v
      - name: shellcheck
        run: |
          shellcheck -x cloud/job_runner.sh cloud/worker/*.sh
          python -c 'import sys; sys.path.insert(0, "cloud"); import fleet; print(fleet.STAGE0)' \
            > "$RUNNER_TEMP/stage0.sh"
          shellcheck -s bash "$RUNNER_TEMP/stage0.sh"
