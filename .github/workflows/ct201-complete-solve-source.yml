# CT201 only validates mathematical/checker source, not native solves.
name: CT201 complete cold ECDLP evidence source tests (NO BENCHMARK)
on:
  pull_request:
    paths:
      - ".github/workflows/ct201-complete-solve-source.yml"
      - "experiments/chained-transfer-public-target/primitive-pricing-01/ct201-complete-solve/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run non-optimized and optimized mathematical guards
        shell: bash
        run: |
          set -euo pipefail
          d=experiments/chained-transfer-public-target/primitive-pricing-01/ct201-complete-solve
          python3 -S -m unittest discover -s "$d" -p 'test_ct201_complete_solve_gate.py' -v
          python3 -O -S -m unittest discover -s "$d" -p 'test_ct201_complete_solve_gate.py' -v
          python3 -S -m py_compile "$d/ct201_complete_solve_gate.py" "$d/test_ct201_complete_solve_gate.py"
          printf 'CT201 source/synthetic only; no native timing, independent PCC or speedup [pcc:unverified]\n'
