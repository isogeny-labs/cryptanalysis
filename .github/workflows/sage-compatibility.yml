name: Sage arithmetic compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/sage-binary-hardware/**'
      - 'experiments/sage-ic-campaign/five-opportunities-20260925/**'
      - 'experiments/sage-ic-campaign/pari-result-20260926/**'
      - 'scripts/sage-release-manifest.json'
      - 'scripts/sage_release.py'
      - '.github/workflows/sage-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/sage-binary-hardware experiments/sage-ic-campaign/five-opportunities-20260925 experiments/sage-ic-campaign/pari-result-20260926
      - run: python3 experiments/sage-binary-hardware/verify_compatibility_archive.py
      - uses: actions/checkout@v7
        with:
          repository: sagemath/sage
          ref: 671dfa344f4cc4a6d54f343cbfd1272ee81698c9
          path: build/sage-source
          sparse-checkout: |
            src/sage/schemes/elliptic_curves
            src/doc/en/reference/arithmetic_curves
      - run: python3 scripts/sage_release.py verify-stack --sage build/sage-source

  native-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/sage-binary-hardware experiments/sage-ic-campaign/five-opportunities-20260925 experiments/sage-ic-campaign/pari-result-20260926
      - name: Build and execute the native CPU kernel with UBSan
        run: python3 experiments/sage-binary-hardware/validate_native.py --ubsan --out build/native-compatibility
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sage-native-${{ matrix.os }}
          path: |
            build/native-compatibility/receipt.json
            build/native-compatibility/*.txt
