name: prime-j0-split-top

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-split-top.yml"
      - "experiments/prime-j0-split-top-20261012/**"
      - "experiments/prime-j0-radix919-terminal-unit-20261012/*.lean"
      - "experiments/prime-j0-secp256k1-native/radix943_screen.py"
      - "experiments/prime-j0-secp256k1-native/unit_orbit_windows_screen.py"
      - "experiments/prime-j0-pareto-tree-20261012/plans.py"
      - "experiments/prime-j0-pareto-tree-20261012/plans.bin"
      - "experiments/prime-j0-sector-digit-20261010/fresh-inputs.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Lean split bound and scalar congruence
    runs-on: main
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit theorem modules
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-20261012/check.py --check

  design:
    name: Exhaustive residue and frozen scalar design replay
    runs-on: main
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - name: Verify radix atlas and source model
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-20261012/screen.py --check

  holdout:
    name: Independent 512-point split-top replay
    runs-on: main
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - name: Verify the frozen scalar and point fixture
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-20261012/holdout.py --check
      - name: Replay all split-term point sums
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-20261012/holdout_replay.py --check
