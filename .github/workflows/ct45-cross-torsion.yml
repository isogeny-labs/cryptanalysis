name: CT45 exact cross-factor 2-power intertwiners
on:
  pull_request:
    paths:
      - 'experiments/chained-transfer-reference/ct45/**'
      - '.github/workflows/ct45-cross-torsion.yml'
  push:
    branches:
      - research/ct45-cross-factor-torsion-20261112
    paths:
      - 'experiments/chained-transfer-reference/ct45/**'
      - '.github/workflows/ct45-cross-torsion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-cross-torsion:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Independently enumerate Frobenius intertwiners and controls
        run: |
          python3 -B experiments/chained-transfer-reference/ct45/ct45_cross_torsion.py >/tmp/ct45.py
          python3 -O -B experiments/chained-transfer-reference/ct45/ct45_cross_torsion.py >/tmp/ct45.opt
          diff -u /tmp/ct45.py /tmp/ct45.opt
          python3 -m py_compile experiments/chained-transfer-reference/ct45/ct45_cross_torsion.py
          node --check experiments/chained-transfer-reference/ct45/ct45_cross_torsion.js
          node experiments/chained-transfer-reference/ct45/ct45_cross_torsion.js >/tmp/ct45.js
          node --no-opt experiments/chained-transfer-reference/ct45/ct45_cross_torsion.js >/tmp/ct45.noopt
          diff -u /tmp/ct45.js /tmp/ct45.noopt
          node experiments/chained-transfer-reference/ct45/ct45_report.js /tmp/CT45_Report.pdf
          cmp /tmp/CT45_Report.pdf experiments/chained-transfer-reference/ct45/CT45_Report.pdf
          cat /tmp/ct45.py /tmp/ct45.js
