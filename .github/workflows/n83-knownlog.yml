name: N83 known-log K600 / K-opt reference row (seeded scalar orbits, LAnone), end-to-end cold Tier 1

# One fresh GitHub-hosted ubuntu-24.04 runner is the Tier 1 instance. The
# frozen protocol is experiments/koblitz-n83-knownlog-20261019/protocol.json
# and the frozen run order is schedule.json next to it: Q0 (exactness: the
# baseline's archived Feistel identity, the frozen identities of both
# known-log bases, and the planted factor-log table that the producer must
# refuse), 40 new held-out cold points, each with one fresh pinned process per
# cold arm (the IC baseline cold arm cP, the known-log arms cL600, cL220 and
# its A/A cLaa, tuned rho rT), and four rank blocks of the baseline's rank
# arm kP, one pinned process at a time. This is a SEPARATELY LABELLED
# REFERENCE ROW: it never replaces the n=83 IC baseline row.
# verify_receipt.py audits the receipt and applies the frozen reading rule.
# Receipts, README, figures, figure sources and smoke diagnostics do not
# trigger a run.
on:
  push:
    branches: [claude/n83-knownlog]
    paths:
      - experiments/koblitz-n83-knownlog-20261019/**
      - .github/workflows/n83-knownlog.yml
      - '!experiments/koblitz-n83-knownlog-20261019/run_github_*/**'
      - '!experiments/koblitz-n83-knownlog-20261019/README.md'
      - '!experiments/koblitz-n83-knownlog-20261019/README.pdf'
      - '!experiments/koblitz-n83-knownlog-20261019/figures/**'
      - '!experiments/koblitz-n83-knownlog-20261019/make_figures.py'
      - '!experiments/koblitz-n83-knownlog-20261019/report_header.tex'
      - '!experiments/koblitz-n83-knownlog-20261019/report_filter.lua'
      - '!experiments/koblitz-n83-knownlog-20261019/smoke/**'
      - '!experiments/koblitz-n83-knownlog-20261019/receipts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-knownlog-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-n83-knownlog-20261019
  RANKPROBE: experiments/koblitz-n83-rankprobe-20261019
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never

jobs:
  knownlog:
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/koblitz-n83-knownlog-20261019 experiments/koblitz-n83-rankprobe-20261019

      - name: Freeze runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/n83-knownlog"
          mkdir -p "$receipt_dir"
          {
            echo "N83_JOB_START=$(date +%s)"
            echo "N83_RECEIPT_DIR=$receipt_dir"
            echo "N83_CRYPTO_REPO=$RUNNER_TEMP/n83-knownlog-crypto"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/n83-knownlog-cargo"
          } >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'provider': 'github_actions',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                                  os.environ['GITHUB_RUN_ATTEMPT'],
                                                  os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'advertised_runner': 'ubuntu-24.04 standard (4 vCPU, 16 GB)',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_cpu_model': next((line.split(':', 1)[1].strip() for line in
                  Path('/proc/cpuinfo').read_text().splitlines()
                  if line.startswith('model name')), None),
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'transparent_hugepage': {name: (Path('/sys/kernel/mm/transparent_hugepage') / name).read_text().strip()
                                       for name in ('enabled', 'defrag')
                                       if (Path('/sys/kernel/mm/transparent_hugepage') / name).exists()},
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'n83-knownlog' / 'allocation.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore the pinned crypto revision and check the frozen sources, inputs and schedule
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$N83_CRYPTO_REPO"
          git -C "$N83_CRYPTO_REPO" cat-file -e "770f6a6925a0d29b768bd79074f54a173e967fe7^{commit}"
          python3 "$EXPERIMENT/restore.py" --crypto-repo "$N83_CRYPTO_REPO" | tee "$N83_RECEIPT_DIR/restore.json"
          python3 "$EXPERIMENT/make_protocol.py" --check
          python3 "$EXPERIMENT/make_schedule.py" --check
          python3 "$EXPERIMENT/make_targets.py" --check
          python3 "$EXPERIMENT/make_power_prior.py" --check
          sha256sum "$EXPERIMENT/protocol.json" "$EXPERIMENT/schedule.json" | tee "$N83_RECEIPT_DIR/frozen.sha256"

      - name: Install the pinned toolchain; build and test the baseline producer, tuned rho and the generator
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | tee "$N83_RECEIPT_DIR/rustc.txt"
          (cd "$RANKPROBE/lift2" && cargo test --release --locked 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-lift2.txt")
          (cd "$RANKPROBE/online" && cargo test --release --locked --bins 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-online.txt")
          (cd "$RANKPROBE/online" && cargo build --release --locked)
          (cd "$EXPERIMENT/knownlog" && cargo test --release --locked 2>&1 | tee "$N83_RECEIPT_DIR/cargo-test-knownlog.txt")
          (cd "$EXPERIMENT/knownlog" && cargo build --release --locked)
          sha256sum "$CARGO_TARGET_DIR"/release/{ic_online_rankprobe_r770,rho_tuned_r770,knownlog_base} \
            | tee "$N83_RECEIPT_DIR/binaries.sha256"

      - name: Re-verify B's archived factor-log table in the pinned oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RANKPROBE/check_log_table.py" --out "$N83_RECEIPT_DIR/log-table-check.json"
          table="$(python3 -c 'import json,sys,os; p=json.load(open(sys.argv[1])); print(os.path.realpath(os.path.join(sys.argv[2], p["online"]["factor_log_table"])))' "$EXPERIMENT/protocol.json" "$RANKPROBE")"
          echo "N83_LOG_TABLE=$table" >> "$GITHUB_ENV"

      - name: Generate both known-log bases and verify every base point's log independently (with planted corruptions)
        shell: bash
        run: |
          set -euo pipefail
          gen="$RUNNER_TEMP/n83-knownlog-gen"
          mkdir -p "$gen"
          for k in 600 220; do
            "$CARGO_TARGET_DIR/release/knownlog_base" "$k" 20261019 "$gen/base_K$k.jsonl" "$gen/logs_K$k.json" \
              | tee -a "$N83_RECEIPT_DIR/knownlog-generation-untimed.jsonl"
          done
          sha256sum "$gen"/* | tee "$N83_RECEIPT_DIR/knownlog-files.sha256"
          python3 "$EXPERIMENT/check_knownlog.py" \
            --base "$gen/base_K600.jsonl" --table "$gen/logs_K600.json" \
            --base "$gen/base_K220.jsonl" --table "$gen/logs_K220.json" \
            --expect-protocol --planted --out "$N83_RECEIPT_DIR/knownlog-check.json"
          rm -rf "$gen"

      - name: Run the frozen schedule on one pinned CPU
        shell: bash
        run: |
          set +e
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 "$EXPERIMENT/run_schedule.py" --bin-dir "$CARGO_TARGET_DIR/release" \
            --gen-bin-dir "$CARGO_TARGET_DIR/release" \
            --log-table "$N83_LOG_TABLE" --receipt-dir "$N83_RECEIPT_DIR/panel" --cpu "$cpu_id" \
            --job-start-epoch "$N83_JOB_START" --deadline-min 200 > "$N83_RECEIPT_DIR/runner-stdout.jsonl"
          echo "schedule_exit=$?" | tee "$N83_RECEIPT_DIR/schedule-exit.txt"

      - name: Audit the receipt and apply the frozen reading rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/verify_receipt.py" "$N83_RECEIPT_DIR/panel" \
            --knownlog-check "$N83_RECEIPT_DIR/knownlog-check.json" | tee "$N83_RECEIPT_DIR/verify-stdout.json"
          cat "$N83_RECEIPT_DIR/panel/result_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve allocation, builds, raw runs and the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: n83-knownlog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-knownlog/
          if-no-files-found: error
          retention-days: 30
