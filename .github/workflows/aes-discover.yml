name: AES discovery laboratory
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/aes-discover/**'
      - 'experiments/aes-distinguisher-lab-20261017/**'
      - '.github/workflows/aes-discover.yml'
  push:
    paths:
      - 'tools/aes-discover/**'
      - 'experiments/aes-distinguisher-lab-20261017/**'
      - '.github/workflows/aes-discover.yml'
permissions:
  contents: read
jobs:
  native-correctness:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: openssl version
      - run: cargo fmt --manifest-path tools/aes-discover/Cargo.toml -- --check
      - run: cargo clippy --release --locked --all-targets --manifest-path tools/aes-discover/Cargo.toml -- -D warnings
      - run: cargo test --release --locked --manifest-path tools/aes-discover/Cargo.toml
      - run: bash -n experiments/aes-distinguisher-lab-20261017/run.sh
