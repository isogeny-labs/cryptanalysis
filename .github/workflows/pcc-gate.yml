name: pcc-gate

# Proof-carrying claims (docs/SABOTAGE_RESISTANCE.md): the sabotage canary, the
# hash-chained ledger, every claim's proofs and the PR prose are checked here.
# On main, the sign job signs verdicts with the CI key a producer never holds.

on:
  pull_request:
    # PR prose is an input to this gate, so edits need a new validation event.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull storage-backed PCC claim inputs
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          mapfile -t claim_inputs < <(python3 tools/artifacts/claim_inputs.py)
          if [ "${#claim_inputs[@]}" -eq 0 ]; then
            echo "No storage-backed claim inputs"
            exit 0
          fi
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            "$RUNNER_TEMP/artifacts-awscli/bin/python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$RUNNER_TEMP/artifacts-awscli/bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 "${claim_inputs[@]}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Report and graph Python source syntax
        run: python3 tools/ci/check_report_graph_python.py
      - name: GLV cap no-worse Lean input binding
        run: python3 experiments/glv-cap-confirm-20261106/formal/no-worse-20261108/check_binding.py
      - name: Sabotage canary
        run: python3 tools/pcc/pcc.py canary
      # The default PR checkout is GitHub's merge commit; its first parent is
      # the exact base used for this tree. A later main tip is unrelated to it.
      - name: Resolve the checked-out merge base
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify "HEAD^1^{commit}"
      # Trust root (docs/SABOTAGE_RESISTANCE.md, "Whose keys count"): a pull
      # request is judged with the keyring of its base branch, never its own,
      # and may not change pcc/keyring.json unless the owner has pinned the new
      # file's SHA-256 in the repository variable PCC_KEYRING_SHA256.
      - name: Ledger chain, base prefix and base keyring (pull request); previous tip (push)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PCC_KEYRING_SHA256: ${{ vars.PCC_KEYRING_SHA256 }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 tools/pcc/pcc.py ledger verify --base HEAD^1
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            python3 tools/pcc/pcc.py ledger verify --base "$BEFORE"
          else
            python3 tools/pcc/pcc.py ledger verify
          fi
      - name: Verify all claims (exit 2 = not covered is allowed)
        env:
          PCC_KEYRING_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/pcc/pcc.py verify-all || [ $? -eq 2 ]
      - name: Strong-claim word in the PR body needs [pcc:ID] or [pcc:unverified]
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PCC_KEYRING_REF: HEAD^1
        run: printf '%s' "$PR_BODY" | python3 tools/pcc/pcc.py lint-prose --stdin
      - name: Advisory prose lint of changed reports
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          files="$(git diff --name-only "HEAD^1...HEAD" -- '**/REPORT.md' 'docs/**/*.md' | while read -r f; do [ -f "$f" ] && echo "$f"; done)"
          if [ -n "$files" ]; then
            echo "$files" | xargs python3 tools/pcc/pcc.py lint-prose
          fi
      - name: pcc self-tests
        run: |
          if [ -f tools/pcc/test_pcc.py ]; then python3 tools/pcc/test_pcc.py; fi

  sign:
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: pcc-sign
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull storage-backed PCC claim inputs
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          mapfile -t claim_inputs < <(python3 tools/artifacts/claim_inputs.py)
          if [ "${#claim_inputs[@]}" -eq 0 ]; then
            echo "No storage-backed claim inputs"
            exit 0
          fi
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            "$RUNNER_TEMP/artifacts-awscli/bin/python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$RUNNER_TEMP/artifacts-awscli/bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 "${claim_inputs[@]}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sign verdicts for claims without standing
        env:
          PCC_SIGNING_KEY: ${{ secrets.PCC_SIGNING_KEY }}
          PCC_KEYRING_SHA256: ${{ vars.PCC_KEYRING_SHA256 }}
        run: |
          if [ -z "$PCC_SIGNING_KEY" ]; then
            echo "::notice::PCC_SIGNING_KEY is not set; no verdicts signed."
            exit 0
          fi
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          printf '%s' "$PCC_SIGNING_KEY" > "$KEYFILE"
          for f in pcc/claims/*.json; do
            [ -f "$f" ] || continue
            id="$(basename "$f" .json)"
            if ! python3 tools/pcc/pcc.py standing "$id"; then
              python3 tools/pcc/pcc.py verdict --sign-key "$KEYFILE" --key-id ci-main "$id" || true
            fi
          done
          rm -f "$KEYFILE"
          if [ -n "$(git status --porcelain pcc/ledger.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pcc/ledger.jsonl
            git commit -m "pcc: signed verdicts for ${GITHUB_SHA::12}"
            git push origin HEAD:main
          fi

  standalone-pcc:
    name: PCC unit controls and shared-code parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || '' }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.claude/hooks/benchrec-hook.sh
            /docs/SABOTAGE_RESISTANCE.md
            /docs/benchmark-records.md
            /docs/curve-identities.md
            /docs/research-wip-policy.json
            /docs/research-wip.md
            /scripts/kb_usage_report.py
            /scripts/test_kb_usage_report.py
            /tools/artifacts/artifacts.py
            /tools/benchrec.py
            /tools/check_lab_parity.py
            /tools/check_skills_parity.py
            /tools/curve_identity.py
            /tools/pcc/pcc.py
            /tools/pcc/test_pcc.py
            /tools/research_wip.py
            /tools/test_benchrec.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Shared-code lock agrees with every materialized mirror
        run: python3 tools/check_lab_parity.py --repo cryptanalysis
      - name: PCC sabotage controls
        run: python3 tools/pcc/pcc.py canary
      - name: PCC unit tests
        run: python3 tools/pcc/test_pcc.py
