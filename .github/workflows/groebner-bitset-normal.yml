name: Groebner certified F4 bounded bitset
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CXX: clang++
      GROEBNER_PHASE_REFERENCE_ROOT: ${{ github.workspace }}
      GROEBNER_F4_REFERENCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and independently audit the frozen reference
        env:
          F4_BITSET_EVIDENCE_ROOT: ${{ runner.temp }}/f4-bitset-evidence
        run: python experiments/groebner-perf-20260924/round112/run_validation.py --output "$F4_BITSET_EVIDENCE_ROOT/reference"
      - name: Build scratch and bitset native engines
        run: |
          python experiments/groebner-perf-20260924/round118/build.py --reference-root "$GITHUB_WORKSPACE"
          python experiments/groebner-perf-20260924/round119/build.py --reference-root "$GITHUB_WORKSPACE"
      - name: Check exact proofs and paired complete queries
        env:
          F4_BITSET_EVIDENCE_ROOT: ${{ runner.temp }}/f4-bitset-evidence
        run: |
          python experiments/groebner-perf-20260924/round118/panel.py --reference-report "$F4_BITSET_EVIDENCE_ROOT/reference/panel/report.json" --output "$F4_BITSET_EVIDENCE_ROOT/scratch"
          python experiments/groebner-perf-20260924/round119/panel.py --reference-report "$F4_BITSET_EVIDENCE_ROOT/reference/panel/report.json" --output "$F4_BITSET_EVIDENCE_ROOT/bitset"
          python experiments/groebner-perf-20260924/round119/test_large.py --output "$F4_BITSET_EVIDENCE_ROOT/large-proof.json"
          python experiments/groebner-perf-20260924/round119/profile.py --reference-root "$GITHUB_WORKSPACE" --reference-report "$F4_BITSET_EVIDENCE_ROOT/reference/panel/report.json" --output "$F4_BITSET_EVIDENCE_ROOT/paired" --reps 3
      - name: Freeze and smoke the isolated complete-query manifest
        env:
          F4_BITSET_EVIDENCE_ROOT: ${{ runner.temp }}/f4-bitset-evidence
        run: |
          python experiments/groebner-perf-20260924/round120/make_isolated_manifest.py --reference-root "$GITHUB_WORKSPACE" --validation-root "$F4_BITSET_EVIDENCE_ROOT/reference" --scratch-panel "$F4_BITSET_EVIDENCE_ROOT/scratch" --bitset-panel "$F4_BITSET_EVIDENCE_ROOT/bitset" --python "$(python -c 'import sys; print(sys.executable)')" --cgroup /sys/fs/cgroup/benchmark-isolated --cpus 4-5 --execution-cpu 4 --mem-nodes 0 --output "$F4_BITSET_EVIDENCE_ROOT/isolated-manifest.json"
          python experiments/groebner-perf-20260924/round120/test_manifest.py --manifest "$F4_BITSET_EVIDENCE_ROOT/isolated-manifest.json" --output "$F4_BITSET_EVIDENCE_ROOT/isolated-worker-smoke.json"
      - name: Retain exact results and failed attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groebner-bitset-${{ matrix.os }}
          path: ${{ runner.temp }}/f4-bitset-evidence
          if-no-files-found: error
