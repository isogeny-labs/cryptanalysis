name: Symmetric Boolean transform kernels

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round46/**'
      - '.github/workflows/symmetric-transform-kernels.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round46/**'
      - '.github/workflows/symmetric-transform-kernels.yml'

permissions:
  contents: read

concurrency:
  group: symmetric-transform-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Symmetric transform kernels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build standalone optimized and sanitized CPU kernels
        run: |
          mkdir -p symmetric-transform-evidence
          python -u experiments/groebner-perf-20260924/round46/build.py > symmetric-transform-evidence/build.log 2>&1
      - name: Validate the independent mathematical reference
        run: python -u experiments/groebner-perf-20260924/round46/reference.py > symmetric-transform-evidence/reference.log 2>&1
      - name: Compare every native coefficient and exact operation count
        run: python -u experiments/groebner-perf-20260924/round46/validate.py > symmetric-transform-evidence/validation.log 2>&1
      - name: Retain reports, executed binaries and runner identity
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, shutil
          package = pathlib.Path('experiments/groebner-perf-20260924/round46')
          out = pathlib.Path('symmetric-transform-evidence')
          out.mkdir(exist_ok=True)
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          metadata.update(platform=platform.platform(), architecture=platform.machine(), scope='Standalone CPU kernel correctness; no GPU or timing claim.')
          (out/'runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          for name in ('reference.json', 'native-validation.json'):
              if (package/name).exists():
                  shutil.copyfile(package/name, out/name)
          if (package/'build').exists():
              shutil.copytree(package/'build', out/'native', dirs_exist_ok=True)
          for pattern in ('*.py', '*.h', '*.cpp', 'kernel-plan.json'):
              for source in package.glob(pattern):
                  (out/'source').mkdir(exist_ok=True)
                  shutil.copyfile(source, out/'source'/source.name)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: symmetric-transform-${{ matrix.os }}
          path: symmetric-transform-evidence/
          if-no-files-found: error
          retention-days: 14
