name: Lean corpus evidence bridge

on:
  pull_request:
    paths:
      - '**/*.lean'
      - '**/lean-toolchain'
      - '**/lakefile.toml'
      - '**/lakefile.lean'
      - 'tools/lean/**'
      - 'reports/lean-evidence-audit-20261021/evidence/corpus/**'
      - 'reports/lean-current-corpus-20261024/**'
      - '.github/workflows/lean-proof-gate.yml'
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - '**/lean-toolchain'
      - '**/lakefile.toml'
      - '**/lakefile.lean'
      - 'tools/lean/**'
      - 'reports/lean-evidence-audit-20261021/evidence/corpus/**'
      - 'reports/lean-current-corpus-20261024/**'
      - '.github/workflows/lean-proof-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exercise positive and negative proof fixtures
        run: tools/lean/selftest/run.sh
      - name: Check all 94 source and proof evidence rows
        run: python3 tools/lean/current-corpus-gate.py --check-receipt reports/lean-current-corpus-20261024/receipt.json
