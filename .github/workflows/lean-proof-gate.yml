name: Lean corpus evidence bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.lean'
      - '**/lean-toolchain'
      - '**/lakefile.toml'
      - '**/lakefile.lean'
      - 'tools/lean/**'
      - 'tools/ci/quartic_certificates.json'
      - 'reports/lean-evidence-audit-20261021/evidence/corpus/**'
      - 'reports/lean-current-corpus-20261024/**'
      - 'reports/lean-current-corpus-20261025/**'
      - 'reports/lean-current-corpus-20261025-cm/**'
      - 'reports/lean-current-corpus-20261025-main-update/**'
      - 'reports/ghs-pr-1104-main-integration-20261025/**'
      - '.github/workflows/lean-proof-gate.yml'
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - '**/lean-toolchain'
      - '**/lakefile.toml'
      - '**/lakefile.lean'
      - 'tools/lean/**'
      - 'tools/ci/quartic_certificates.json'
      - 'reports/lean-evidence-audit-20261021/evidence/corpus/**'
      - 'reports/lean-current-corpus-20261024/**'
      - 'reports/lean-current-corpus-20261025/**'
      - 'reports/lean-current-corpus-20261025-cm/**'
      - 'reports/lean-current-corpus-20261025-main-update/**'
      - 'reports/ghs-pr-1104-main-integration-20261025/**'
      - '.github/workflows/lean-proof-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exercise positive and negative proof fixtures
        run: tools/lean/selftest/run.sh
      - name: Refuse changed quartic sources and build pins
        run: python3 tools/lean/test_current_corpus_gate.py
      - name: Detect Hecke theorem sources
        id: hecke
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '--', '*.lean'], text=True).splitlines()
          present = any(path.startswith('experiments/hecke-') and
                        '/formal/' in path for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"present={'true' if present else 'false'}\n")
          PY
      - name: Reclaim temporary runner space for Mathlib
        if: steps.hecke.outputs.present == 'true'
        run: |
          df -h /
          for sdk in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - name: Fetch pinned Hecke Mathlib cache
        if: steps.hecke.outputs.present == 'true'
        run: |
          cd experiments/hecke-432-formal-ci-20261025
          lake exe cache get
      - name: Check frozen corpus and build admitted theorem modules
        run: python3 tools/lean/current-corpus-gate.py --check-receipt reports/lean-current-corpus-20261025-main-update/receipt.json
      - name: Check exhaustive Hecke audit refusal controls
        if: steps.hecke.outputs.present == 'true'
        run: python3 tools/lean/hecke-audit-selftest.py
