name: Known-label pair-index correctness
on:
  pull_request:
    branches: [main]
    paths:
      - docs/known-label-pair-index-20261029/**
      - .github/workflows/known-label-pair-index.yml
  push:
    branches: [main]
    paths:
      - docs/known-label-pair-index-20261029/**
      - .github/workflows/known-label-pair-index.yml
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned correctness dependencies
        run: python -m pip install python-flint==0.9.0 sympy==1.14.0
      - name: Symbolic and small-curve correctness controls
        run: python -m unittest discover -s docs/known-label-pair-index-20261029 -p test_pair_index.py -v
