name: Groebner native seeded completion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924/round110
      - name: Fetch frozen reference audit source
        run: git fetch --no-tags --depth=1 origin 5c2aed25be6663b27577e45c303d03ed40580861
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and verify native seeded completion
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round110/run_validation.py --output groebner-native-seeded-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groebner-native-seeded-${{ matrix.os }}
          path: groebner-native-seeded-evidence
          if-no-files-found: error
