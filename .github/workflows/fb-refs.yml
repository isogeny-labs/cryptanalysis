name: fb-refs

# Every factor_base_sha256 or point-set digest (point_set_sha256, ...) cited by a
# committed result under experiments/ or
# ecc2k130/research/ must be archived in experiments/fb-archive (index.csv) or
# listed in experiments/fb-archive/unarchived.csv, the closed list of known
# debt. The list is exact both ways, so it can only shrink. See
# experiments/fb-archive/README.md ("Citation guard").
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/**"
      - "ecc2k130/research/**"
      - ".github/workflows/fb-refs.yml"
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "ecc2k130/research/**"
      - ".github/workflows/fb-refs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-refs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    name: cited factor bases are archived
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 ecc2k130/research experiments
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check citations against the archive
        run: python experiments/fb-archive/refs.py check
