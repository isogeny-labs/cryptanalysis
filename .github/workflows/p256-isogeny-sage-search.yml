name: Sage horizontal search

"on":
  workflow_dispatch:
    inputs:
      ells:
        description: Comma-separated ramified or split prime degrees
        required: true
        default: "3,5,11,13"
      depth:
        description: Breadth-first depth
        required: true
        default: "2"
      max_nodes:
        description: Maximum number of retained curves
        required: true
        default: "100"
      benchmark_seconds:
        description: Seconds per timing trial and candidate
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  explore:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:10.6
      options: --user root
    env:
      SEARCH_ELLS: ${{ inputs.ells }}
      SEARCH_DEPTH: ${{ inputs.depth }}
      SEARCH_MAX_NODES: ${{ inputs.max_nodes }}
      BENCHMARK_SECONDS: ${{ inputs.benchmark_seconds }}
    defaults:
      run:
        working-directory: experiments/p256-isogeny-search-20261005
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/p256-isogeny-search-20261005
      - name: Explore explicit horizontal paths
        run: >-
          sage -python scripts/explore_sage.py
          --ells "$SEARCH_ELLS"
          --depth "$SEARCH_DEPTH"
          --max-nodes "$SEARCH_MAX_NODES"
          --output runs/sage/candidates.json
      - name: Benchmark every generated candidate
        env:
          PYTHONPATH: src
        run: >-
          sage -python scripts/benchmark_interleaved.py
          --candidates runs/sage/candidates.json
          --seconds "$BENCHMARK_SECONDS"
          --trials 7
          --output runs/sage/benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: p256-sage-horizontal-search
          path: experiments/p256-isogeny-search-20261005/runs/sage
