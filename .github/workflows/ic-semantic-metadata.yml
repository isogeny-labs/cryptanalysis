name: ic-semantic-metadata

on:
  pull_request:
    paths:
      - AGENTS.md
      - experiments/ic-candidate-catalog/**
      - experiments/ic-bench/candidates/**
      - experiments/ic-bench/workloads/**
      - experiments/fb-archive/index.csv
      - .github/workflows/ic-semantic-metadata.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - experiments/ic-candidate-catalog/**
      - experiments/ic-bench/candidates/**
      - experiments/ic-bench/workloads/**
      - experiments/fb-archive/index.csv
      - .github/workflows/ic-semantic-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metadata:
    name: canonical identities and references
    runs-on: main
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/fb-archive experiments/ic-bench experiments/ic-candidate-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only validators
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.23.0
      - name: Negative controls
        run: python -m unittest discover -s experiments/ic-candidate-catalog -p 'test_validate_semantics.py' -v
      - name: Validate committed metadata
        run: python experiments/ic-candidate-catalog/validate_semantics.py
