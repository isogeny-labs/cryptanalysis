name: ic-semantic-metadata

on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - experiments/ic-candidate-catalog/**
      - experiments/ic-bench/candidates/**
      - experiments/ic-bench/workloads/**
      - experiments/fb-archive/index.csv
      - .github/workflows/ic-semantic-metadata.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - experiments/ic-candidate-catalog/**
      - experiments/ic-bench/candidates/**
      - experiments/ic-bench/workloads/**
      - experiments/fb-archive/index.csv
      - .github/workflows/ic-semantic-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metadata:
    name: canonical identities and references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/fb-archive experiments/ic-bench experiments/ic-candidate-catalog
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install metadata-only validators
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.23.0
      - name: Negative controls
        run: python -m unittest discover -s experiments/ic-candidate-catalog -p 'test_validate_semantics.py' -v
      - name: Validate committed metadata
        run: python experiments/ic-candidate-catalog/validate_semantics.py
