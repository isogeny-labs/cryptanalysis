name: CT154 public-point-only q223 source and mixed negation rho
on:
  pull_request:
    paths:
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/ct154_*"
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/ct153_original_cold_reference.cpp"
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/ct153_reference_audit.py"
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/CT154_*"
      - ".github/workflows/ct154-public-point-neg-rho.yml"
  push:
    branches:
      - research/ct146-correction-torsion-contract-20261115
    paths:
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/ct154_*"
      - "experiments/chained-transfer-public-target/norm-point-reuse-01/CT154_*"
      - ".github/workflows/ct154-public-point-neg-rho.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compile and independently audit real public-point DLP inputs
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/chained-transfer-public-target/norm-point-reuse-01
          g++ -std=c++17 -O3 -Wall -Wextra -Werror "$D/ct154_public_point_reference.cpp" -o /tmp/ct154
          /tmp/ct154 --self-test > /tmp/ct154-self.json
          python3 "$D/ct154_public_input_audit.py" /tmp/ct154 --quick --output /tmp/ct154-quick.json > /tmp/ct154-summary.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/ct154-summary.json'))
          assert a['records']==12 and a['targets']==2 and a['negative_controls']==8
          assert a['no_scalar_passed_to_cpp'] and a['all_source_solutions_python_verified']
          assert a['standing']=='[pcc:unverified]'
          assert all(x>0 for x in a['arm_max_rss_kb'].values())
          PY
          sha256sum "$D/ct153_original_cold_reference.cpp" "$D/ct154_public_point_reference.cpp" "$D/ct154_public_input_audit.py" /tmp/ct154
