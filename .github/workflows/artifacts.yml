name: artifacts
# Data files live in S3 with a manifest in Git (docs/artifacts.md). This runs the
# tool's own tests, fails a pull request that adds or modifies a file the policy
# says belongs in the store, and checks that every workflow naming moved data
# pulls it. A PR that must commit such a file anyway carries the `large-file-ok`
# label; the check then reports the files and passes. It runs no experiment.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The merge commit and its first parent (the base); blobs on demand only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/artifacts/
            /.artifacts/
            /.github/workflows/
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs
      - name: Unit tests
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: python3 -m unittest tools/artifacts/test_artifacts.py
      - name: No added or modified file that belongs in the store
        if: github.event_name == 'pull_request'
        env:
          LARGE_FILE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'large-file-ok') }}
        run: |
          if python3 tools/artifacts/artifacts.py check HEAD^1 HEAD; then exit 0; fi
          if [ "$LARGE_FILE_OK" = true ]; then
            echo "::warning::store-policy files committed under the large-file-ok label"
            exit 0
          fi
          exit 1
      - name: Workflows that name moved data pull it
        run: python3 tools/artifacts/wire_workflows.py --check
