name: Groebner parity witness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924/round107
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and verify parity witness
        env:
          CXX: clang++
        run: python experiments/groebner-perf-20260924/round107/run_validation.py --output groebner-parity-witness-evidence
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groebner-parity-witness-${{ matrix.os }}
          path: groebner-parity-witness-evidence
          if-no-files-found: error
