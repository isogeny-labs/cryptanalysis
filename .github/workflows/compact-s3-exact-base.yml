name: Compact S3 exact-base evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/compact-s3-m4-20261003/**'
      - '.github/workflows/compact-s3-exact-base.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/compact-s3-m4-20261003/**'
      - '.github/workflows/compact-s3-exact-base.yml'
  workflow_dispatch:

# A new commit supersedes runs for this PR or branch; manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/compact-s3-m4-20261003
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check exact-base and solver-gate derived receipts
        run: |
          python3 experiments/compact-s3-m4-20261003/derive_q1413_base_calls.py --check
          python3 experiments/compact-s3-m4-20261003/screen_q1414_exact_uniform_query_bound.py --check
          python3 experiments/compact-s3-m4-20261003/screen_q1416_exact_pair_index.py --check
          python3 experiments/compact-s3-m4-20261003/build_q1415_stage_comparison.py --check
      - name: Validate frozen source and artifact hashes
        run: python3 experiments/compact-s3-m4-20261003/verify_q1413_q1416_archive.py
      - name: Rebuild the work ledger exactly
        run: |
          python3 experiments/compact-s3-m4-20261003/build_work_ledger.py
          git diff --exit-code -- experiments/compact-s3-m4-20261003/work_ledger.json
