name: ECC2K-130 runner
on:
  push:
    branches: [main]
    paths: ['ecc2k130/runner/**', '.github/workflows/ecc2k130-runner.yml']
  pull_request:
    branches: [main]
    paths: ['ecc2k130/runner/**', '.github/workflows/ecc2k130-runner.yml']
# A new commit supersedes runs for this PR or branch; manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  local-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 ecc2k130/runner
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cloud persistence and CLI checks
        run: make -C ecc2k130/runner check-cloud check-cli
      - name: Build and validate the CPU engine
        run: |
          make -C ecc2k130/runner cpu
          ./ecc2k130/runner/ecc2k130-cpu --test
      - name: Rehearse shutdown and remote checkpoint recovery
        run: bash ecc2k130/runner/aws/rehearse_worker.sh
