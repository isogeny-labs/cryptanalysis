name: prime-j0-split-top-native

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prime-j0-split-top-native.yml"
      - "experiments/prime-j0-split-top-native-20261012/**"
      - "experiments/prime-j0-split-top-20261012/**"
      - "experiments/prime-j0-secp256k1-native/**"
      - "experiments/prime-j0-pareto-tree-20261012/plans.bin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Locked Rust build and 512-point replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/split671-native-target
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/prime-j0-secp256k1-native experiments/prime-j0-split-top-20261012 experiments/prime-j0-split-top-native-20261012
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path experiments/prime-j0-secp256k1-native/Cargo.toml
      - name: Build disposable native evaluator
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-native-20261012/native_overlay.py \
            "$RUNNER_TEMP/split671-native-overlay" --build
      - name: Audit tables and all 512 public points
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-split-top-native-20261012/native_replay.py \
            --binary "$CARGO_TARGET_DIR/release/eisenstein_fixed" \
            --overlay-record "$RUNNER_TEMP/split671-native-overlay/overlay.json" --check
