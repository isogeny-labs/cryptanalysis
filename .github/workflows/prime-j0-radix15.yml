name: prime-j0-radix15

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-radix15.yml"
      - "experiments/prime-j0-fifteen-position-radix-20261015/**"
      - "experiments/prime-j0-variable-orbit-radix-20261014/**"
      - "experiments/prime-j0-nearest-digit-12211-20261014/**"
      - "experiments/prime-j0-nearest-orbit-12211-20261014/**"
      - "experiments/prime-j0-mixed640-materialized-tree-20261013/**"
      - "experiments/prime-j0-mixed-radix640-20261010/**"
      - "experiments/prime-j0-tau-power16-20261010/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: Lean 4.34.1 proof modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit theorem modules
        run: bash experiments/prime-j0-fifteen-position-radix-20261015/check_lean268.sh

  frozen-replays:
    name: Arithmetic, group and Tier 1 receipt replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compare replayed calculations with frozen evidence
        run: python3 experiments/prime-j0-fifteen-position-radix-20261015/check_frozen.py
