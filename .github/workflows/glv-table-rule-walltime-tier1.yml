name: GLV table rule c=12 Tier 1 wall time

# A fresh standard Linux runner times main (7cb3dce) against #1065 (f630cc3) on the
# frozen panels of experiments/glv-table-rule-walltime-20261023. The in-repository
# Tier 1 preflight and noise gates decide whether the receipt supports an
# instance-scoped wall-time result (PROTOCOL.md, PROTOCOL-AMENDMENT-1.md).
on:
  push:
    branches: [glv-table-rule-walltime]
    paths:
      - .github/workflows/glv-table-rule-walltime-tier1.yml
      - experiments/glv-table-rule-walltime-20261023/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glv-table-rule-walltime-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-walltime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXP: experiments/glv-table-rule-walltime-20261023
    steps:
      - uses: actions/checkout@v4
        with:
          # the full tree (~58k files) does not fit beside two build trees; only these paths are used
          sparse-checkout: |
            scripts
            experiments/glv-table-rule-walltime-20261023
            .github

      - name: Freeze runner identity
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/glv-walltime"
          mkdir -p "$dir/bin"
          echo "GLV_DIR=$dir" >> "$GITHUB_ENV"
          echo "GLV_INSTANCE=gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$dir/host-probe.json"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              'provider': 'github_actions',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'), 'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'), 'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'), 'advertised_runner': 'ubuntu-24.04 standard',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_mem_total_kib': next((l.split()[1] for l in Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemTotal:')), None),
              'git_sha': os.environ['GITHUB_SHA'], 'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'], os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path(os.environ['RUNNER_TEMP'], 'glv-walltime', 'allocation.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          (cd "$EXP" && sha256sum -c PROTOCOL.sha256)

      - name: Build both arms from the pinned commits
        shell: bash
        run: |
          set -euo pipefail
          # Fetch the two pinned commits without blobs (f630cc3 is #1065's head before its squash
          # merge, on branch glv-table-rule-c12) and check out only the directories the build reads.
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            7cb3dce4cac9176d74afb6403048b5fabbaab834 f630cc30baa97eff39b9fa88d57fd273bae7d735
          git cat-file -e 'f630cc30baa97eff39b9fa88d57fd273bae7d735^{commit}'
          git cat-file -e '7cb3dce4cac9176d74afb6403048b5fabbaab834^{commit}'
          for arm in main:7cb3dce4cac9176d74afb6403048b5fabbaab834 c12:f630cc30baa97eff39b9fa88d57fd273bae7d735; do
            name=${arm%%:*}; commit=${arm#*:}
            src="$RUNNER_TEMP/src-$name"
            git worktree add --no-checkout --detach "$src" "$commit"
            git -C "$src" sparse-checkout set --cone src include cmake bindings cuda tools tests usecases experiments/prime-j0-hot-orbit-table
            git -C "$src" checkout --detach "$commit"
            df -h "$RUNNER_TEMP" | tail -1
            cmake -S "$src" -B "$RUNNER_TEMP/build-$name" -DCMAKE_BUILD_TYPE=Release -DCA_CUPQC=OFF
            cmake --build "$RUNNER_TEMP/build-$name" --target cryptanalysis_static -j4
            cc -O3 -std=c11 -static -I"$src/include" "$EXP/bench_glv_panel.c" \
              "$RUNNER_TEMP/build-$name/libcryptanalysis.a" -lm -lpthread -o "$GLV_DIR/bin/glv-panel-$name"
          done
          cc --version | head -1 | tee "$GLV_DIR/compiler.txt"
          sha256sum "$GLV_DIR"/bin/* | tee "$GLV_DIR/binaries.sha256"
          printf 'frozen: main 32630811fe91ab72de1b352c90e28f721bfff462b8bb12c133eab3c0f4176afc\nfrozen: c12  43a8938471945ab61478b02e223ae668fe5e36700d6e6191782517901e15a98a\n'

      - name: Tier 1 preflight
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          for fam in j1728 j0; do
            python3 "$EXP/gh_manifest.py" "$EXP/manifest_$fam.json" "$GLV_DIR/manifest_$fam.json" \
              --workdir "$GITHUB_WORKSPACE" --bindir "$GLV_DIR/bin" --cpu "$cpu" \
              --instance-id "$GLV_INSTANCE" --receipt "$GLV_DIR/allocation.json"
            python3 scripts/isolated_bench.py probe "$GLV_DIR/manifest_$fam.json" > "$GLV_DIR/preflight_$fam.json" || true
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], d.get('ok'), d.get('problems'))" "$GLV_DIR/preflight_$fam.json"
          done

      - name: Run 15 alternating pairs per family
        shell: bash
        run: |
          set -uo pipefail
          for fam in j1728 j0; do
            python3 scripts/isolated_bench.py --queue-root "$GLV_DIR/queue" run "$GLV_DIR/manifest_$fam.json" \
              > "$GLV_DIR/run-summary_$fam.json"
            echo "run $fam exit $?"
            cat "$GLV_DIR/run-summary_$fam.json"
          done

      - name: Preserve receipts, raw pairs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glv-table-rule-walltime-tier1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/glv-walltime/
          if-no-files-found: error
          retention-days: 14
