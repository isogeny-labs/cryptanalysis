name: N83 Bernstein-Lange gap on the rank-probe producer (measurement), Tier 1

# One fresh GitHub-hosted ubuntu-24.04 runner is the Tier 1 instance. The
# frozen protocol is experiments/koblitz-n83-bl-rankprobe-20261019/protocol.json
# and the frozen run order is schedule.json next to it. The IC and rho arms are
# the n=83 baseline row's (the rank-probe producer, cP / kP, and the tuned rho
# rT770), built and wrapped by koblitz-n83-rankprobe-20261019 unchanged; the
# BL arm is koblitz-n83-bl-arm-20261014's machinery unchanged (rT770 walk,
# bl_sg --field fold, DP 6). Order: positive control (counts only), the K1
# rank block (gives P_IC), the BL precomputation at P_IC, the three table
# checks, then Q0, 64 new held-out points (cP, cPaa, rT, BL, BLaa) and rank
# blocks K2-K4, one pinned process at a time. verify_receipt.py audits the
# receipt and reads the frozen measurement. The host CPU is recorded by
# scripts/host_cpu_record.py. Receipts, README, figures and smoke files do
# not trigger a run.
on:
  push:
    branches: [claude/n83-bl-rankprobe]
    paths:
      - experiments/koblitz-n83-bl-rankprobe-20261019/**
      - .github/workflows/n83-bl-rankprobe.yml
      - scripts/host_cpu_record.py
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/run_github_*/**'
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/README.md'
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/README.pdf'
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/figures/**'
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/smoke/**'
      - '!experiments/koblitz-n83-bl-rankprobe-20261019/receipts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-bl-rankprobe-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT: experiments/koblitz-n83-bl-rankprobe-20261019
  RANKPROBE: experiments/koblitz-n83-rankprobe-20261019
  BLARM: experiments/koblitz-n83-bl-arm-20261014
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: never

jobs:
  bl-rankprobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Freeze runner, host CPU and source identity
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/n83-bl-rankprobe"
          mkdir -p "$receipt_dir"
          cpu_id="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          {
            echo "N83_JOB_START=$(date +%s)"
            echo "N83_RECEIPT_DIR=$receipt_dir"
            echo "N83_CRYPTO_REPO=$RUNNER_TEMP/n83-bl-rankprobe-crypto"
            echo "N83_IC_TARGET=$RUNNER_TEMP/n83-bl-rankprobe-cargo-ic"
            echo "N83_BL_TARGET=$RUNNER_TEMP/n83-bl-rankprobe-cargo-bl"
            echo "N83_CPU=$cpu_id"
          } >> "$GITHUB_ENV"
          python3 scripts/isolated_bench.py probe-host > "$receipt_dir/host-probe.json"
          python3 scripts/host_cpu_record.py --cpu "$cpu_id" --merge-into "$receipt_dir/host-probe.json" \
            --out "$receipt_dir/host-cpu.json"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          cpu = json.loads((Path(os.environ['RUNNER_TEMP']) / 'n83-bl-rankprobe' / 'host-cpu.json').read_text())
          receipt = {
              'provider': 'github_actions',
              'instance_id': 'gh-{}-{}-{}'.format(os.environ['GITHUB_RUN_ID'],
                                                  os.environ['GITHUB_RUN_ATTEMPT'],
                                                  os.environ['GITHUB_JOB']),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'advertised_runner': 'ubuntu-24.04 standard (4 vCPU, 16 GB)',
              'observed_cpu_affinity': sorted(os.sched_getaffinity(0)),
              'observed_cpu_model': cpu['model_name'],
              'observed_microcode': cpu['microcode'],
              'observed_host_class': cpu['host_class'],
              'observed_mem_total_kib': next((line.split()[1] for line in
                  Path('/proc/meminfo').read_text().splitlines()
                  if line.startswith('MemTotal:')), None),
              'transparent_hugepage': cpu['kernel']['transparent_hugepage'],
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'run_url': '{}/{}/actions/runs/{}'.format(os.environ['GITHUB_SERVER_URL'],
                  os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID']),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'n83-bl-rankprobe' / 'allocation.json'
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(cpu['host_class'])
          PY

      - name: Restore the pinned crypto revision and check the frozen sources, inputs and schedule
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/aburan28/crypto.git "$N83_CRYPTO_REPO"
          git -C "$N83_CRYPTO_REPO" cat-file -e "770f6a6925a0d29b768bd79074f54a173e967fe7^{commit}"
          python3 "$EXPERIMENT/restore.py" --crypto-repo "$N83_CRYPTO_REPO" | tee "$N83_RECEIPT_DIR/restore.json"
          python3 "$EXPERIMENT/make_schedule.py" --check
          python3 "$EXPERIMENT/make_targets.py" --check
          sha256sum "$EXPERIMENT/protocol.json" "$EXPERIMENT/schedule.json" | tee "$N83_RECEIPT_DIR/frozen.sha256"

      - name: Install the pinned toolchain, build and test both crates
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | tee "$N83_RECEIPT_DIR/rustc.txt"
          (cd "$RANKPROBE/lift2" && CARGO_TARGET_DIR="$N83_IC_TARGET" cargo test --release --locked 2>&1 \
            | tee "$N83_RECEIPT_DIR/cargo-test-lift2.txt")
          (cd "$RANKPROBE/online" && CARGO_TARGET_DIR="$N83_IC_TARGET" cargo test --release --locked --bins 2>&1 \
            | tee "$N83_RECEIPT_DIR/cargo-test-ic.txt")
          (cd "$RANKPROBE/online" && CARGO_TARGET_DIR="$N83_IC_TARGET" cargo build --release --locked)
          (cd "$BLARM" && CARGO_TARGET_DIR="$N83_BL_TARGET" cargo test --release --locked --bin bl_sg 2>&1 \
            | tee "$N83_RECEIPT_DIR/cargo-test-bl.txt")
          (cd "$BLARM" && CARGO_TARGET_DIR="$N83_BL_TARGET" cargo build --release --locked --bin bl_sg)
          sha256sum "$N83_IC_TARGET"/release/{ic_online_rankprobe_r770,rho_tuned_r770} "$N83_BL_TARGET/release/bl_sg" \
            | tee "$N83_RECEIPT_DIR/binaries.sha256"

      - name: Re-verify B's archived factor-log table in the pinned oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RANKPROBE/check_log_table.py" --out "$N83_RECEIPT_DIR/log-table-check.json"
          echo "N83_LOG_TABLE=$GITHUB_WORKSPACE/experiments/koblitz-single-target-n83-tier1-20261014/tier1_github_38523707244/precompute/factor_logs_n83_K600.json" >> "$GITHUB_ENV"

      - name: BL positive control on E_0 over GF(2^69), rT770 (step counts only, all CPUs)
        shell: bash
        run: |
          set +e
          python3 "$BLARM/control.py" --bin-dir "$N83_BL_TARGET/release" --out "$N83_RECEIPT_DIR/control" \
            --only pc69-rT770 --workers "$(nproc)" | tee "$N83_RECEIPT_DIR/control-stdout.jsonl"
          echo "control_exit=${PIPESTATUS[0]}" | tee "$N83_RECEIPT_DIR/control-exit.txt"

      - name: Rank block K1 on the execution CPU (gives P_IC)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXPERIMENT/run_schedule.py" --phase budget --ic-bin-dir "$N83_IC_TARGET/release" \
            --bl-bin-dir "$N83_BL_TARGET/release" --log-table "$N83_LOG_TABLE" \
            --receipt-dir "$N83_RECEIPT_DIR/panel" --budget-out "$N83_RECEIPT_DIR/ic_budget" --cpu "$N83_CPU" \
            --job-start-epoch "$N83_JOB_START" --deadline-min 300 | tee "$N83_RECEIPT_DIR/runner-stdout-budget.jsonl"

      - name: BL precomputation at P_IC (the BL-arm experiment's bl_table.py)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BLARM/bl_table.py" precompute --bin-dir "$N83_BL_TARGET/release" --cpu "$N83_CPU" \
            --ic-receipt "$N83_RECEIPT_DIR/ic_budget/precompute_receipt.json" --out "$N83_RECEIPT_DIR/bl"

      - name: Check the stored table (regeneration, every record, oracle sample)
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(python3 -c 'import os; print(",".join(str(c) for c in sorted(os.sched_getaffinity(0))))')"
          regen_cpu="$(python3 -c 'import os; c = sorted(os.sched_getaffinity(0)); print(c[1] if len(c) > 1 else c[0])')"
          python3 "$BLARM/bl_table.py" check --bin-dir "$N83_BL_TARGET/release" \
            --receipt-dir "$N83_RECEIPT_DIR/bl" --regen-cpu "$regen_cpu" --verify-cpus "$cpus"

      - name: Run the frozen panel on one pinned CPU
        shell: bash
        run: |
          set +e
          python3 "$EXPERIMENT/run_schedule.py" --phase panel --ic-bin-dir "$N83_IC_TARGET/release" \
            --bl-bin-dir "$N83_BL_TARGET/release" --log-table "$N83_LOG_TABLE" \
            --receipt-dir "$N83_RECEIPT_DIR/panel" --bl-receipt-dir "$N83_RECEIPT_DIR/bl" --cpu "$N83_CPU" \
            --job-start-epoch "$N83_JOB_START" --deadline-min 300 > "$N83_RECEIPT_DIR/runner-stdout-panel.jsonl"
          echo "panel_exit=$?" | tee "$N83_RECEIPT_DIR/panel-exit.txt"

      - name: Audit the receipt and apply the frozen decision rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$N83_RECEIPT_DIR/panel/runs.jsonl" ]; then
            echo "no schedule row ran; nothing to audit" | tee "$N83_RECEIPT_DIR/verify-stdout.json"
            exit 0
          fi
          python3 "$EXPERIMENT/verify_receipt.py" "$N83_RECEIPT_DIR" | tee "$N83_RECEIPT_DIR/verify-stdout.json"
          cat "$N83_RECEIPT_DIR/result_table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Move the BL table out of the receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bl-rankprobe-table"
          if [ -f "$N83_RECEIPT_DIR/bl/table.bin" ]; then
            mv "$N83_RECEIPT_DIR/bl/table.bin" "$RUNNER_TEMP/n83-bl-rankprobe-table/table.bin"
            cp "$N83_RECEIPT_DIR/bl/precompute_receipt.json" "$RUNNER_TEMP/n83-bl-rankprobe-table/"
          fi
          find "$N83_RECEIPT_DIR/control" -name 'table_*.bin' -delete 2>/dev/null || true

      - name: Preserve allocation, host record, controls, budget, table checks, raw runs and the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-bl-rankprobe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bl-rankprobe/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the BL table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-bl-rankprobe-table-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bl-rankprobe-table/
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
