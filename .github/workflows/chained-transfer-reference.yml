            research/chained_jacobian_transfers_20261110/evidence/isogeny-cycle-first-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/isogeny-cycle-second-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/unbalanced-direct-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/unbalanced-reciprocal-identity-01.json
            isogeny_algos
