name: Binary genus-two cover

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/binary-genus2-cover/**'
      - 'tools/ecdlp-surfaces/**'
      - 'docs/ecdlp-surfaces/certificates/**'
      - 'src/binary_ecc/**'
      - 'suite/src/binary_ecc/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'suite/Cargo.toml'
      - 'suite/vendor/crypto-analysis-core/**'
      - 'tools/bootstrap_crypto_analysis_core.sh'
      - 'suite/Cargo.lock'
      - 'research/binary_genus2_cover_20261014/**'
      - '.github/workflows/binary-genus2-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /build.rs
            /src/
            /suite/Cargo.toml
            /suite/Cargo.lock
            /suite/build.rs
            /suite/src/
            /suite/vendor/crypto-analysis-core/
            /suite/cuda/
            /suite/docs/ic/calibration.json
            /challenges/elliptic/corpus.json
            /bindings/rust/
            /include/
            /cuda/
            /tools/ecdlp-surfaces/
            /tools/binary-genus2-cover/
            /tools/bootstrap_crypto_analysis_core.sh
            /docs/ecdlp-surfaces/certificates/
            /docs/curves/registry.json
            /docs/ecbench/schema.sql
            /docs/ic/calibration.json
            /docs/ic/boundary_targets.json
            /research/binary_genus2_cover_20261014/
            /tools/artifacts/
            /.artifacts/config.json
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/ecdlp-surfaces research/binary_genus2_cover_20261014
      - name: Install stable Rust with formatting and lint tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          echo 'RUSTUP_TOOLCHAIN=stable' >> "$GITHUB_ENV"
      - name: Verify pinned crypto analysis dependency
        run: tools/bootstrap_crypto_analysis_core.sh
      - run: tools/binary-genus2-cover/check.sh
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/binary_genus2_cover_20261014/lean
            tools/artifacts
            .artifacts
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/ecdlp-surfaces research/binary_genus2_cover_20261014
      - name: Install pinned Lean and verify download
        run: |
          curl --fail --location --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec "$RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Build and audit actual theorem declarations
        working-directory: research/binary_genus2_cover_20261014/lean
        run: |
          lake build
          lean BinaryGenusTwo.lean | tee axioms.log
          if rg 'sorryAx|sorry|admit' axioms.log; then exit 1; fi
