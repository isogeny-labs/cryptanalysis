name: Groebner certified F4 seed obstruction
on:
  push:
    paths:
      - '.github/workflows/groebner-field-obstruction.yml'
      - 'experiments/groebner-perf-20260924/round11/**'
      - 'experiments/groebner-perf-20260924/round108/**'
      - 'experiments/groebner-perf-20260924/round110/**'
      - 'experiments/groebner-perf-20260924/round112/**'
      - 'experiments/groebner-perf-20260924/round116/**'
      - 'experiments/groebner-perf-20260924/round118/**'
      - 'experiments/groebner-perf-20260924/round119/**'
      - 'experiments/groebner-perf-20260924/round121/**'
  pull_request:
    paths:
      - '.github/workflows/groebner-field-obstruction.yml'
      - 'experiments/groebner-perf-20260924/round11/**'
      - 'experiments/groebner-perf-20260924/round108/**'
      - 'experiments/groebner-perf-20260924/round110/**'
      - 'experiments/groebner-perf-20260924/round112/**'
      - 'experiments/groebner-perf-20260924/round116/**'
      - 'experiments/groebner-perf-20260924/round118/**'
      - 'experiments/groebner-perf-20260924/round119/**'
      - 'experiments/groebner-perf-20260924/round121/**'
permissions:
  contents: read
jobs:
  exact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CXX: clang++
      GROEBNER_PHASE_REFERENCE_ROOT: ${{ github.workspace }}
      GROEBNER_F4_REFERENCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924/round108 experiments/groebner-perf-20260924/round11 experiments/groebner-perf-20260924/round110 experiments/groebner-perf-20260924/round112 experiments/groebner-perf-20260924/round116 experiments/groebner-perf-20260924/round118 experiments/groebner-perf-20260924/round119 experiments/groebner-perf-20260924/round121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and independently audit the frozen reference
        run: python experiments/groebner-perf-20260924/round112/run_validation.py --output f4-obstruction-evidence/reference
      - name: Build the baseline and field-pair probe
        run: python experiments/groebner-perf-20260924/round121/build.py --reference-root "$GITHUB_WORKSPACE"
      - name: Check exact field pairs and final proofs
        run: |
          python experiments/groebner-perf-20260924/round121/test_guard.py | tee f4-obstruction-evidence/oracle.log
          python experiments/groebner-perf-20260924/round121/panel.py --reference-report f4-obstruction-evidence/reference/panel/report.json --output f4-obstruction-evidence/panel
          python experiments/groebner-perf-20260924/round119/test_large.py --output f4-obstruction-evidence/large-proof.json
          python experiments/groebner-perf-20260924/round121/profile.py --reference-root "$GITHUB_WORKSPACE" --reference-report f4-obstruction-evidence/reference/panel/report.json --output f4-obstruction-evidence/paired --reps 1
      - name: Retain exact results and raw failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groebner-field-obstruction-${{ matrix.os }}
          path: f4-obstruction-evidence
          if-no-files-found: error
