name: CT126 actual-map pricing source guards
on:
  pull_request:
    paths:
      - 'experiments/chained-transfer-public-target/primitive-pricing-01/**'
      - '.github/workflows/ct126-primitive-pricing.yml'
  push:
    branches:
      - 'research/ct126-actual-primitive-pricing-20261115'
    paths:
      - 'experiments/chained-transfer-public-target/primitive-pricing-01/**'
      - '.github/workflows/ct126-primitive-pricing.yml'
permissions:
  contents: read
jobs:
  pricing-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            experiments/chained-transfer-public-target/primitive-pricing-01/
      - name: Static syntax and two negative-cost controls, no benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/chained-transfer-public-target/primitive-pricing-01
          python3 -m py_compile check_pair.py
          python3 -S check_pair.py --self-test
          bash -n run_pair.sh
          rustfmt --emit stdout src/main.rs >/dev/null
          echo "SOURCE-ONLY PASS: no native execution or timing claim"
