name: prime-j0-radix929-native-overlay

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prime-j0-radix929-native-overlay.yml"
      - "experiments/prime-j0-radix929-topball-20261012/**"
      - "experiments/prime-j0-secp256k1-native/src/bin/eisenstein_fixed.rs"
      - "experiments/prime-j0-secp256k1-native/src/bin/eisenstein_fixed/unit_orbit_windows.rs"
      - "experiments/prime-j0-pareto-tree-20261012/plans.bin"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-replay:
    name: Exhaustive top rank and 512 native point replays
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/prime-j0-radix929-topball-20261012
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path experiments/prime-j0-secp256k1-native/Cargo.toml
      - name: Build disposable native overlay
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/radix929-target"
          python3 experiments/prime-j0-radix929-topball-20261012/native_overlay.py \
            "$RUNNER_TEMP/radix929-overlay" --build
      - name: Verify every top rank and independent point
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-radix929-topball-20261012/native_replay.py \
            --binary "$RUNNER_TEMP/radix929-target/release/eisenstein_fixed" \
            --overlay-record "$RUNNER_TEMP/radix929-overlay/overlay.json" --check
