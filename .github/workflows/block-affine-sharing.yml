name: Packed affine sharing cost screen

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round39/**'
      - '.github/workflows/block-affine-sharing.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/groebner-perf-20260924/round39/**'
      - '.github/workflows/block-affine-sharing.yml'

permissions:
  contents: read

concurrency:
  group: block-affine-sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Packed affine sharing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments/groebner-perf-20260924
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build native and UBSan pilots and validate exact proofs
        run: |
          mkdir -p block-affine-evidence
          python -u experiments/groebner-perf-20260924/round39/validate_packed.py \
            --affine-report experiments/groebner-perf-20260924/round39/fixtures/affine-block-probe.json.gz \
            --output block-affine-evidence/cost-screen.json \
            > block-affine-evidence/validation.log 2>&1
      - name: Retain runner identity
        if: always()
        run: |
          mkdir -p block-affine-evidence
          python - <<'PY'
          import json, os, pathlib
          metadata = {k: os.environ.get(k) for k in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH')}
          pathlib.Path('block-affine-evidence/runner.json').write_text(json.dumps(metadata, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packed-affine-sharing-${{ matrix.os }}
          path: block-affine-evidence/
          if-no-files-found: error
          retention-days: 14
