name: CT156 source-only signed-x BSGS bounded correctness
on:
  pull_request:
    paths:
      - 'experiments/chained-transfer-public-target/norm-point-reuse-01/ct156_*'
      - 'experiments/chained-transfer-public-target/norm-point-reuse-01/ct155_projective_bsgs.cpp'
      - 'experiments/chained-transfer-public-target/norm-point-reuse-01/ct153_original_cold_reference.cpp'
      - '.github/workflows/ct156-signed-source.yml'
  workflow_dispatch:
jobs:
  ct156-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and independently verify bounded public source Q
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/chained-transfer-public-target/norm-point-reuse-01
          g++ -std=c++17 -O3 -Wall -Wextra -Werror "$D/ct155_projective_bsgs.cpp" -o /tmp/ct156-old
          g++ -std=c++17 -O3 -Wall -Wextra -Werror "$D/ct156_negation_bsgs.cpp" -o /tmp/ct156-new
          /tmp/ct156-new --self-test
          python3 -S "$D/ct156_negation_audit.py" --baseline /tmp/ct156-old --candidate /tmp/ct156-new --quick
          python3 -O -S "$D/ct156_negation_audit.py" --baseline /tmp/ct156-old --candidate /tmp/ct156-new --quick
