name: lab-parity

# The cross-repository contract (crypto-autoresearcher:docs/lab-contract.md):
# every skill resolves on both agent surfaces, and every shared file matches
# docs/shared-code.lock.json.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Skills surfaces
        run: python3 tools/check_skills_parity.py
      - name: Shared-code lock
        run: python3 tools/check_lab_parity.py --repo cryptanalysis
