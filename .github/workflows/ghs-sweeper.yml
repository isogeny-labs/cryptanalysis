name: Rust GHS sweeper

on:
  pull_request:
    paths:
      - 'experiments/ghs-sweeper/**'
      - '.github/workflows/ghs-sweeper.yml'
  push:
    paths:
      - 'experiments/ghs-sweeper/**'
      - '.github/workflows/ghs-sweeper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path experiments/ghs-sweeper/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path experiments/ghs-sweeper/Cargo.toml --all-targets -- -D warnings
      - name: Fixed census and checkpoint regression tests
        run: cargo test --release --locked --manifest-path experiments/ghs-sweeper/Cargo.toml -- --test-threads=2
