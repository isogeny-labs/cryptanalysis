name: Orbit pair-index Lean proof

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/orbit-quotient-summation/**
      - .github/workflows/orbit-pair-index-lean.yml
  push:
    branches: [main]
    paths:
      - experiments/orbit-quotient-summation/**
      - .github/workflows/orbit-pair-index-lean.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/orbit-quotient-summation/lean
      - name: Check exact transitive axiom set
        run: experiments/orbit-quotient-summation/lean/check.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare pair lookup with direct enumeration
        run: python -m unittest discover -s experiments/orbit-quotient-summation -p 'test_*.py' -v
