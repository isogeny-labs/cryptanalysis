name: prime-j0-joint-horner

on:
  pull_request:
    paths:
      - ".github/workflows/prime-j0-joint-horner.yml"
      - "experiments/prime-j0-eisenstein-residue-20261015/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-mixed77:
    name: Portable mixed77 build and exact replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and OpenSSL linker library
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Build portable source and replay same-point outputs
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-eisenstein-residue-20261015/verify_portable_mixed77.py \
            --output "$RUNNER_TEMP/mixed77-portable-replay.json"
          python3 - "$RUNNER_TEMP/mixed77-portable-replay.json" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1]))
          assert receipt['status'] == 'portable_exact_output_replay_passed'
          assert receipt['atlas_include_bytes_count'] == 0
          assert receipt['mixed77_exact_outputs'] == 257
          assert receipt['control_exact_outputs'] == 4
          assert receipt['exact_outputs'] == 261
          print(receipt['status'], receipt['binary_sha256'])
          PY

  proof:
    name: Pinned Lean joint Horner proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan for pinned Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit joint scalar multiplication theorems
        run: |
          set -euo pipefail
          python3 experiments/prime-j0-eisenstein-residue-20261015/verify_joint_seed_graph_lean.py
          python3 experiments/prime-j0-eisenstein-residue-20261015/verify_triple81_digit_lean.py
          python3 experiments/prime-j0-eisenstein-residue-20261015/verify_triple243_lean.py
          python3 experiments/prime-j0-eisenstein-residue-20261015/verify_triple_mixed_lean.py
