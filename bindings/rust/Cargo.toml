[workspace]
resolver = "2"
members = ["cryptanalysis-sys", "cryptanalysis", "cryptanalysis-cuda", "curve-audit", "hashed-ecdl-tensor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor: hashed-ecdl-tensor depends on getrandom 0.4, which declares
# rust-version 1.85 (edition 2024), and cryptanalysis depends on that crate,
# so the core crates build from 1.85 on.  (Before the getrandom 0.4 bump the
# floor was 1.78, the oldest Cargo that reads the lockfile v4.)
# cryptanalysis-cuda raises its own floor to 1.88.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/aburan28/cryptanalysis"
