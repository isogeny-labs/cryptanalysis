[package]
name = "n83-closure-indexlift-online"
version = "0.1.0"
edition = "2021"
publish = false

# Binaries are crypto 770f6a69 examples restored by ../restore.py into
# ../snapshots/r770 (the reconcile experiment's restore, digest-checked).
# The IC producer is koblitz-n83-indexlift-20261019's producer (derived by
# ../make_indexlift_source.py from the rank-probe producer, digest-checked
# against 7df72603...) plus koblitz-n83-closure-20261019's four replacements
# (../make_closure_source.py, whose own output is digest-checked against
# 8916e034...), composed by ../make_online_source.py; it includes
# ../lift2/src/lib.rs through a #[path] module. The tuned rho is A's
# configured worker (Fold/64/DP6), unchanged. Dependency set and Cargo.lock
# are the reconcile r770 crate's (package renamed).
# koblitz-n83-indexbuild2-20261020: side A is the current row, the
# index-build producer of koblitz-n83-indexbuild-20261020 (PR #1006,
# derived by ../make_indexbuild_source.py, bc6a31c7...); side B is its
# round-2 derivation (../make_indexbuild2_source.py: seven counted
# replacements; the same root index, built faster). The closure +
# index-lift producer is still derived (the parents' chain) but is no
# longer built. The two IC binaries are built together, by one toolchain,
# from one lock file.
# koblitz-n83-rankfinder-20261021: side A is the current row, the round-2
# index-build producer of koblitz-n83-indexbuild2-20261020 (PR #1009,
# derived by ../make_indexbuild2_source.py, 4008a47a...); side B is its
# rank-finder derivation (../make_rankfinder_source.py: six counted
# replacements; the same rank-stage probe keys, computed with the linear
# run finder). The index-build producer (bc6a31c7...) is still derived (the
# parents' chain) but is no longer built.
# koblitz-n83-fieldops-20261104: side B, the field-ops producer derived by
# ../make_fieldops_source.py from the rank-finder producer (301615b3...),
# built with -C target-feature=+pclmulqdq (.cargo/config.toml) so the
# producer's inlined carry-less field products compile inline. Dependency set
# and Cargo.lock are side A's (../online), verbatim.
[[bin]]
name = "ic_online_fieldops_r770"
path = "../snapshots/r770/examples/koblitz_orbit_dlp_fast_online_fieldops.rs"

[dependencies]
crypto_lib = { package = "crypto", path = "../snapshots/r770", default-features = false }
blake3 = "1.5"
hex = "0.4"
libc = "0.2"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
