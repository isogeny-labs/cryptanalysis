<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">H111 first-layer halving carry parity flow</title>
  <desc id="desc">A public target is halved in the prime-order group, both points are lifted by the canonical Hensel section, and their doubling discrepancy is mapped to the first formal layer. A fixed bit predicate conditionally drives repeated halving and scalar reconstruction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>
    .title{font:700 27px sans-serif;fill:#0f172a}.sub{font:15px sans-serif;fill:#334155}.box{stroke-width:2;rx:14}.h{font:700 17px sans-serif;fill:#0f172a}.t{font:14px sans-serif;fill:#1e293b}.tag{font:700 12px sans-serif;letter-spacing:.5px}.edge{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.bluebox{fill:#dbeafe;stroke:#2563eb}.orangebox{fill:#ffedd5;stroke:#ea580c}.greenbox{fill:#dcfce7;stroke:#16a34a}.purplebox{fill:#f3e8ff;stroke:#9333ea}.redbox{fill:#fee2e2;stroke:#dc2626}.amberbox{fill:#fef3c7;stroke:#d97706}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.green{fill:#15803d}.purple{fill:#7e22ce}.red{fill:#b91c1c}.amber{fill:#b45309}
  </style></defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="48" y="48" class="title">H111: public halving → p² section carry → parity → reconstruction</text>
  <text x="48" y="76" class="sub">No scalar-indexed interpolation or learned table: 24 fixed predicates receive identical controls.</text>
  <rect x="45" y="115" width="240" height="145" class="box bluebox"/><text x="68" y="145" class="tag blue">PUBLIC TARGET</text><text x="68" y="178" class="h">Q=[k]G</text><text x="68" y="208" class="t">H=[(r+1)/2]Q</text><text x="68" y="234" class="t">wrap iff k is odd</text>
  <rect x="335" y="115" width="260" height="145" class="box orangebox"/><text x="358" y="145" class="tag orange">NONHOMOMORPHIC SECTION</text><text x="358" y="178" class="h">s₀(H), s₀(Q)</text><text x="358" y="208" class="t">two Hensel lifts mod p²</text><text x="358" y="234" class="t">no relation assumed</text>
  <rect x="645" y="115" width="270" height="145" class="box greenbox"/><text x="668" y="145" class="tag green">BINARY COCYCLE</text><text x="668" y="178" class="h">C₂=[2]s₀(H)−s₀(Q)</text><text x="668" y="208" class="t">red(C₂)=O</text><text x="668" y="234" class="t">κ=t(C₂)/p in Fₚ</text>
  <rect x="965" y="115" width="270" height="145" class="box purplebox"/><text x="988" y="145" class="tag purple">24 PUBLIC PREDICATES</text><text x="988" y="178" class="h">zero / LSB / sign / χ₂</text><text x="988" y="208" class="t">offsets −1,0,1</text><text x="988" y="234" class="t">each bit and complement</text>
  <path d="M285 188 H325" class="edge"/><path d="M595 188 H635" class="edge"/><path d="M915 188 H955" class="edge"/>
  <rect x="170" y="345" width="360" height="150" class="box redbox"/><text x="195" y="375" class="tag red">FROZEN CONTROLS</text><text x="195" y="408" class="h">Challenge section and label specificity</text><text x="195" y="438" class="t">random sections; matched parity labels</text><text x="195" y="464" class="t">coordinate isomorphisms; torsion carry κ=0</text>
  <rect x="690" y="345" width="390" height="150" class="box amberbox"/><text x="715" y="375" class="tag amber">CONDITIONAL POSITIVE PATH</text><text x="715" y="408" class="h">Exact parity-guided halving</text><text x="715" y="438" class="t">R←half(R−bG); append bit b</text><text x="715" y="464" class="t">recover k and verify [k]G=Q</text>
  <path d="M1100 260 C1080 305 980 320 920 338" class="edge"/><path d="M1000 260 C850 305 540 305 430 338" class="edge dash"/>
  <rect x="430" y="585" width="430" height="90" class="box purplebox"/><text x="455" y="615" class="tag purple">PROMOTION GATE</text><text x="455" y="647" class="h">All 28 rows + uniform proof + Lean + total cost</text><path d="M880 495 C850 545 790 560 730 578" class="edge"/>
</svg>
