[package]
name = "ghs-sweeper"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aburan28/cryptanalysis"
description = "Checkpointed binary cover-candidate enumeration and evidence triage"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
