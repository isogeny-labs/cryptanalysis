<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">H112 selected predicate accuracy by curve and controls</title>
  <desc id="desc">Ranges of the best accuracy after selection among 144 predicates. No row was exact.</desc>
  <rect width="1100" height="700" fill="#f8fafc"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #172033; }
    .axis { stroke: #64748b; stroke-width: 2; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .curve { stroke: #2563eb; stroke-width: 12; stroke-linecap: round; }
    .control { stroke: #d97706; stroke-width: 12; stroke-linecap: round; }
    .iso { fill: #7c3aed; }
    .endpoint { fill: #ffffff; stroke-width: 3; }
  </style>
  <text x="70" y="60" font-size="30" font-weight="700">H112: best selected accuracy, not an oracle</text>
  <text x="70" y="94" font-size="18" fill="#475569">144 frozen predicates · all nonzero targets · 0/28 exact canonical rows</text>

  <line x1="310" y1="135" x2="1010" y2="135" class="axis"/>
  <line x1="310" y1="135" x2="310" y2="620" class="axis"/>
  <g font-size="15" text-anchor="middle">
    <line x1="310" y1="135" x2="310" y2="620" class="grid"/><text x="310" y="650">50%</text>
    <line x1="450" y1="135" x2="450" y2="620" class="grid"/><text x="450" y="650">60%</text>
    <line x1="590" y1="135" x2="590" y2="620" class="grid"/><text x="590" y="650">70%</text>
    <line x1="730" y1="135" x2="730" y2="620" class="grid"/><text x="730" y="650">80%</text>
    <line x1="870" y1="135" x2="870" y2="620" class="grid"/><text x="870" y="650">90%</text>
    <line x1="1010" y1="135" x2="1010" y2="620" class="grid"/><text x="1010" y="650">100% exact</text>
  </g>

  <g font-size="17" text-anchor="end">
    <text x="285" y="170">E101</text><line x1="395" y1="164" x2="515" y2="164" class="curve"/>
    <text x="285" y="215">E127</text><line x1="466" y1="209" x2="569" y2="209" class="curve"/>
    <text x="285" y="260">E149</text><line x1="411" y1="254" x2="442" y2="254" class="curve"/>
    <text x="285" y="305">E211</text><line x1="398" y1="299" x2="424" y2="299" class="curve"/>
    <text x="285" y="350">E283</text><line x1="380" y1="344" x2="425" y2="344" class="curve"/>
    <text x="285" y="395">E503</text><line x1="352" y1="389" x2="389" y2="389" class="curve"/>
    <text x="285" y="440">E907</text><line x1="356" y1="434" x2="378" y2="434" class="curve"/>
    <text x="285" y="510">random sections</text><line x1="440" y1="504" x2="549" y2="504" class="control"/>
    <text x="285" y="555">matched labels</text><line x1="429" y1="549" x2="582" y2="549" class="control"/>
    <text x="285" y="600">isomorphic E101/E127</text>
  </g>
  <circle cx="532" cy="594" r="7" class="iso"/><circle cx="453" cy="594" r="7" class="iso"/>
  <line x1="1010" y1="135" x2="1010" y2="620" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1000" y="122" font-size="15" text-anchor="end" fill="#dc2626">required promotion gate</text>
  <g font-size="15">
    <rect x="720" y="474" width="20" height="8" rx="4" fill="#2563eb"/><text x="750" y="483">canonical generator relabelings</text>
    <rect x="720" y="503" width="20" height="8" rx="4" fill="#d97706"/><text x="750" y="512">matched controls</text>
    <circle cx="730" cy="538" r="6" fill="#7c3aed"/><text x="750" y="543">coordinate isomorphisms</text>
  </g>
</svg>
