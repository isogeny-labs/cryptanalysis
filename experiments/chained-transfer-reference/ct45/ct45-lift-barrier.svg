<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="1100" height="470" fill="#f8fafc"/><text x="55" y="58" font-family="Arial" font-size="29" font-weight="bold" fill="#17223d">Exact 4-torsion lift barrier</text><text x="55" y="96" font-family="Arial" font-size="17" fill="#526078">E109 to E113 over F101; Frobenius traces -7 and -11</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="145" width="300" height="180" rx="15" fill="#e4f3e9" stroke="#17644b" stroke-width="2"/><text x="215" y="192" font-size="24" fill="#145235">Level 4</text><text x="215" y="235" font-size="18" fill="#145235">12 invertible</text><text x="215" y="268" font-size="18" fill="#145235">6 Weil anti-isometries</text><rect x="400" y="145" width="300" height="180" rx="15" fill="#fff1e1" stroke="#ac6a16" stroke-width="2"/><text x="550" y="192" font-size="24" fill="#8c4d0b">Level 8</text><text x="550" y="235" font-size="18" fill="#8c4d0b">0 invertible</text><text x="550" y="268" font-size="18" fill="#8c4d0b">all matrices even</text><rect x="735" y="145" width="300" height="180" rx="15" fill="#f5e7ea" stroke="#a8384d" stroke-width="2"/><text x="885" y="192" font-size="24" fill="#8c2a3b">Level 16</text><text x="885" y="235" font-size="18" fill="#8c2a3b">0 invertible</text><text x="885" y="268" font-size="18" fill="#8c2a3b">all matrices divisible by 4</text></g><path d="M365 235 L400 235 M700 235 L735 235" fill="none" stroke="#b65a26" stroke-width="4"/><text x="550" y="392" font-family="Arial" font-size="21" text-anchor="middle" fill="#17223d">Every intertwiner obeys 4X=0. No nonzero compatible 2-adic Tate map.</text><text x="550" y="430" font-family="Arial" font-size="16" text-anchor="middle" fill="#526078">Independent Python and JavaScript arithmetic; [pcc:unverified]</text></svg>
