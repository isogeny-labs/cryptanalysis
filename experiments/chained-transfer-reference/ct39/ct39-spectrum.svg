<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="CT39 genus-two Frobenius fingerprint checks">
<rect width="1000" height="460" fill="#f8fafc"/>
<text x="40" y="45" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f172a">CT39: same rational count, different Frobenius spectrum</text>
<text x="40" y="75" font-family="sans-serif" font-size="15" fill="#475569">F101 monic sextics; each point count uses the two infinity points</text>
<rect x="38" y="105" width="560" height="256" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="60" y="145" font-family="sans-serif" font-size="21" font-weight="700" fill="#075985">Actual T0, T1, T2</text>
<text x="60" y="186" font-family="monospace" font-size="18" fill="#0c4a6e">#C(F101)     = 120</text>
<text x="60" y="222" font-family="monospace" font-size="18" fill="#0c4a6e">#C(F101^2)   = 10436</text>
<text x="60" y="258" font-family="monospace" font-size="17" fill="#0c4a6e">P_J = (T²+7T+101)(T²+11T+101)</text>
<text x="60" y="306" font-family="sans-serif" font-size="18" fill="#075985">Same E109 × E113 isogeny class</text>
<rect x="625" y="105" width="340" height="256" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="646" y="145" font-family="sans-serif" font-size="21" font-weight="700" fill="#991b1b">Smooth T0 coefficient mutant</text>
<text x="646" y="186" font-family="monospace" font-size="17" fill="#7f1d1d">#C(F101)     = 120</text>
<text x="646" y="222" font-family="monospace" font-size="17" fill="#7f1d1d">#C(F101^2)   = 10314</text>
<text x="646" y="258" font-family="monospace" font-size="17" fill="#7f1d1d">a2=218 (not 279)</text>
<text x="646" y="306" font-family="sans-serif" font-size="17" fill="#991b1b">Different isogeny class</text>
<path d="M598 215 L624 215" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<text x="500" y="408" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Necessary spectrum certificate ≠ selected isogeny, kernel or ECDLP speedup</text>
<text x="500" y="437" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">Two independent local point counters; [pcc:unverified]</text>
</svg>
