<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410">
<rect width="1000" height="410" fill="#f8fafc"/>
<text x="48" y="40" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#12253a">CT38 / Rational shadows hide geometric 7-kernels</text>
<rect x="54" y="85" rx="12" width="250" height="124" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="75" y="122" font-size="20" font-family="DejaVu Sans" fill="#193a6f">B(F101)</text><text x="75" y="153" font-family="DejaVu Sans" font-size="15">12,317 rational classes</text><text x="75" y="179" font-family="DejaVu Sans" font-size="15">all unchanged by both [m]</text>
<rect x="365" y="85" rx="12" width="280" height="124" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="382" y="121" font-size="19" font-family="DejaVu Sans">d[m] on tangent</text><text x="382" y="152" font-size="15" font-family="DejaVu Sans">m = 1 (mod 101)</text><text x="382" y="177" font-size="15" font-family="DejaVu Sans">same first-order map</text>
<rect x="702" y="85" rx="12" width="246" height="124" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="718" y="120" font-family="DejaVu Sans" font-size="19">B[7] over Fbar101</text><text x="718" y="151" font-family="DejaVu Sans" font-size="15">2,401 geometric points</text><text x="718" y="176" font-family="DejaVu Sans" font-size="15">different images!</text>
<path d="M304 145 H353 M645 145 H690" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M348 138 l10 7 -10 7 M685 138 l10 7 -10 7" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="70" y="251" rx="9" width="415" height="95" fill="#ffffff" stroke="#94a3b8"/>
<text x="89" y="278" font-family="DejaVu Sans" font-size="18" font-weight="bold">m = 1 + 101 * 12317</text><text x="89" y="310" font-family="DejaVu Sans" font-size="17">m mod 7 = 6: negates 7-torsion</text>
<rect x="512" y="251" rx="9" width="421" height="95" fill="#ffffff" stroke="#94a3b8"/>
<text x="531" y="278" font-family="DejaVu Sans" font-size="18" font-weight="bold">m = 1 + 4 * 101 * 12317</text><text x="531" y="310" font-family="DejaVu Sans" font-size="17">m mod 7 = 0: kills all 7-torsion</text>
<text x="65" y="387" font-family="DejaVu Sans" font-size="16" fill="#475569">Independent degree + geometric kernel checks distinguish them. [pcc:unverified]</text>
</svg>
