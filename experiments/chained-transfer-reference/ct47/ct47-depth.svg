<text x="101" y="159">Extension k</text><text x="101" y="181">r = v2(k)</text>
<text x="362" y="74">3 does not divide k</text><text x="362" y="103">depth = r + 2</text>
<text x="362" y="240">3 divides k</text><text x="362" y="269">depth = r + 3</text>
<text x="644" y="73">Cyclic mod 2</text><text x="644" y="101">trace obstruction</text>
<text x="644" y="235">Scalar mod 2</text><text x="644" y="264">determinant obstruction</text>
<text x="876" y="144" font-size="15">Fixed k:</text><text x="876" y="166" font-size="15">finite depth</text><text x="876" y="194" font-size="14">min k = 2^(s-2)</text><text x="876" y="215" font-size="13">for s &gt;= 3</text>
