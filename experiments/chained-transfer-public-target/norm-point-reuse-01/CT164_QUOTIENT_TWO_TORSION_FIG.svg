<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="CT164 quotient torsion screen; nine invariant kernels, six mixed candidates, and two necessary hyperelliptic orbit types">
