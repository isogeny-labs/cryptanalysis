<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#182230}.title{font-size:26px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.axis{stroke:#526174;stroke-width:2}.fresh{fill:#2878b5}.control{fill:#d88b24}.good{fill:#31865b}.warn{fill:#bd5a45}.box{fill:#f3f6f9;stroke:#536579;stroke-width:2}</style>
<text x="40" y="42" class="title">Separate support-eight executions: probe cap and rank</text>
<text x="45" y="78" class="small">Probe counts are from separate runs against the same frozen 40-source set; they are not added.</text>
<line x1="120" y1="450" x2="1020" y2="450" class="axis"/>
<rect x="260" y="167.6" width="210" height="282.4" class="warn"/>
<text x="365" y="147.6" text-anchor="middle" class="label">rank 38</text>
<text x="365" y="482" text-anchor="middle" class="label">Initial cap</text>
<text x="365" y="510" text-anchor="middle" class="small">12,000,000 probes</text>
<text x="365" y="532" text-anchor="middle" class="small">168 verified rows</text>
<rect x="650" y="160.0" width="210" height="290.0" class="good"/>
<text x="755" y="140.0" text-anchor="middle" class="label">rank 39</text>
<text x="755" y="482" text-anchor="middle" class="label">Full follow-up</text>
<text x="755" y="510" text-anchor="middle" class="small">12,323,269 probes</text>
<text x="755" y="532" text-anchor="middle" class="small">225 verified rows</text>
</svg>
