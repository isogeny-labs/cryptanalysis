claim_under_review: >-
  The new Lean declarations state a polynomial numerator identity and, for
  field elements X and Y with X nonzero and Y squared equal to X cubed minus
  16, the cited rational coordinates satisfy the target equation with 432.
  Determine whether these statements match and prove the algebraic part of
  the archived map formula; do not infer the complete modular-map identity.
coordinator_prior: >-
  The polynomial identity appears plausible and the X-nonzero side condition
  is necessary for the rational expressions. The exact pinned Lean build has
  not yet concluded, and the archived map claim has separate exceptional-point,
  isogeny-degree, modular-parametrization, and Sturm bridges.
joint_owners:
  - joint: blind algebra, assumptions, exceptional values, nearby false cases
    owner: blind_algebra
    attack: Derive both identities from the displayed equations alone; find a concrete counterexample when the source-curve hypothesis or a formula coefficient is changed.
    breaking_artifact: Exact field values satisfying the actual assumptions but falsifying the conclusion, or a widened statement falsified by an explicit tuple.
  - joint: source-to-statement fidelity, original formula, archived scope, build and proof surface
    owner: source_fidelity
    attack: Compare the elaborated Lean types and source formula against the archived RESULT and Sage program; locate every unproved bridge and test whether the theorem silently assumes a conclusion.
    breaking_artifact: An exact mismatch in coefficient, denominator, curve, quantifier or exception, or a source-backed claim not represented by the theorem.
