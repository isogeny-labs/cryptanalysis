<text class="small" x="58" y="155">Prime field, nonsingular curve, point order r</text>
<text class="small" x="58" y="180">Lagrange: r divides actual cardinality</text>
<text class="small" x="58" y="205">Hasse bound for actual cardinality</text>
<text class="small" x="58" y="230">Candidate bounds and width &lt; r conversion</text>
<rect class="proved" x="486" y="101" width="396" height="168" rx="12"/>
<text x="506" y="128" font-weight="700">Lean theorem — verified scope</text>
<text class="small" x="506" y="155">n = k·r; m = l·r; width &lt; r</text>
<text class="small" x="506" y="180">n ≤ m + width; m ≤ n + width</text>
<text class="small" x="506" y="210">Therefore n = m</text>
<text class="small" x="506" y="240">1 theorem; only propext, Quot.sound</text>
