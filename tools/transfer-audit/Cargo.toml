[package]
name = "transfer-audit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scoped binary ECDLP transfer classification and obstruction certificates"
[workspace]
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[profile.release]
overflow-checks = true
