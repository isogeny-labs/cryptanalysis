remote anonymous {
    exchange_mode aggressive, main;
    proposal {
        encryption_algorithm 3des;
        hash_algorithm md5;
        authentication_method pre_shared_key;
        dh_group 2;
    }
}
sainfo anonymous {
    pfs_group 2;
    encryption_algorithm aes 128, 3des;
    authentication_algorithm hmac_sha1, hmac_md5;
}
