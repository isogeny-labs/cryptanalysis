# fixture
config setup
    charondebug="ike 1"

conn %default
    keyingtries=%forever
    authby=secret

conn legacy-aggr
    keyexchange=ikev1
    aggressive=yes
    ike=3des-md5-modp1024
    esp=aes128-sha1
    left=%defaultroute
    right=203.0.113.9
    auto=start

conn modern
    keyexchange=ikev2
    ike=aes256gcm16-prfsha384-ecp384!
    esp=aes256gcm16-ecp384!
    authby=rsa-sha1
    left=%any
    right=%any

conn l2tp-psk
    type=transport
    leftprotoport=17/1701
    rightprotoport=17/%any
    ike=aes256-sha256-modp2048

include /etc/ipsec.d/*.conf
