$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/ssl/certs/server.pem"
    ssl.privkey = "/etc/ssl/private/server.key"
    ssl.use-sslv3 = "enable"
    ssl.cipher-list = "HIGH:!aNULL"
    ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2",
                                "Curves" => "X25519:secp384r1")
}
