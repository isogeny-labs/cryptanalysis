<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    DocumentRoot /var/www/shop
    SSLEngine on
    SSLProtocol all -SSLv3
    SSLCipherSuite HIGH:MEDIUM:!aNULL:RC4-SHA
    SSLOpenSSLConfCmd DHParameters "/etc/ssl/dhparam1024.pem"
    SSLCertificateFile /etc/ssl/certs/server.pem
    SSLCertificateKeyFile /etc/ssl/private/server.key
    SSLUseStapling on
    <Directory /var/www/shop>
        SSLCipherSuite NULL-SHA
    </Directory>
</VirtualHost>
</IfModule>
<VirtualHost *:80>
    ServerName shop.example.com
</VirtualHost>
