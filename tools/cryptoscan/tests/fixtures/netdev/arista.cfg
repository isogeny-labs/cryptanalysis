! Command: show running-config
! device: leaf-01 (DCS-7050SX3-48YC8, EOS-4.22.1F)
!
! boot system flash:/EOS-4.22.1F.swi
!
hostname leaf-01
!
username admin privilege 15 role network-admin secret sha512 $6$abcd$PLACEHOLDERxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
username legacy privilege 15 secret 5 $1$abcd$xxxxxxxxxxxxxxxxxxxxxx
!
snmp-server community PLACEHOLDER-RO ro
snmp-server user monitor netops v3 auth md5 PLACEHOLDER priv des PLACEHOLDER
!
management api http-commands
   protocol http
   no shutdown
!
management ssh
   cipher aes256-ctr 3des-cbc
   mac hmac-sha1 hmac-md5
   key-exchange diffie-hellman-group1-sha1 ecdh-sha2-nistp256
!
management telnet
   no shutdown
!
management security
   ssl profile API
      tls versions 1.0 1.1 1.2
      cipher-list ECDHE+AESGCM:DES-CBC3-SHA
!
end
