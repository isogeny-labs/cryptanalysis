#TMSH-VERSION: 13.1.3
sys global-settings {
    hostname bigip-01.example.net
}
ltm profile client-ssl /Common/legacy-clientssl {
    app-service none
    cert /Common/default.crt
    ciphers DEFAULT:RC4-SHA:DES-CBC3-SHA
    defaults-from /Common/clientssl
    key /Common/default.key
    options { dont-insert-empty-fragments no-sslv3 }
}
sys httpd {
    ssl-protocol "all -SSLv2"
    ssl-ciphersuite DEFAULT:!aNULL
}
sys snmp {
    communities {
        /Common/comm-public {
            community-name PLACEHOLDER
            source default
        }
    }
    users {
        monitor {
            auth-protocol md5
            privacy-protocol des
            username monitor
        }
    }
}
sys sshd {
    include "Ciphers aes128-cbc,3des-cbc
MACs hmac-md5,hmac-sha1"
}
