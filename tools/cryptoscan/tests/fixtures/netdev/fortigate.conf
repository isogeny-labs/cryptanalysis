#config-version=FGT60F-7.0.12-FW-build0523-230823:opmode=0:vdom=0:user=admin
#conf_file_ver=12345
#buildno=0523
#global_vdom=1
config system global
    set admin-sport 443
    set admin-telnet enable
    set hostname "fgt-branch-07"
    set strong-crypto disable
    set ssl-min-proto-version TLSv1
end
config system interface
    edit "wan1"
        set ip 198.51.100.20 255.255.255.0
        set allowaccess ping https ssh http telnet
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2PLACEHOLDERxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    next
end
config system snmp community
    edit 1
        set name "PLACEHOLDER-COMM"
        set query-v1-status disable
        set trap-v1-status disable
    next
end
config vpn ipsec phase1-interface
    edit "to-hq"
        set interface "wan1"
        set ike-version 1
        set mode aggressive
        set peertype any
        set proposal 3des-md5 aes128-sha1
        set dhgrp 2 5
        set remote-gw 192.0.2.1
        set psksecret ENC PLACEHOLDERpsk
    next
end
config vpn ipsec phase2-interface
    edit "to-hq-p2"
        set phase1name "to-hq"
        set proposal des-md5 aes128-sha1
        set dhgrp 2
    next
end
