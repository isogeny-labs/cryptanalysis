!Software Version V200R010C00SPC600
#
sysname hw-agg-01
#
snmp-agent
snmp-agent local-engineid 800007DB03PLACEHOLDER
snmp-agent community read cipher %^%#PLACEHOLDER%^%#
snmp-agent sys-info version v2c v3
snmp-agent usm-user v3 monitor authentication-mode md5 cipher %^%#PLACEHOLDER%^%# privacy-mode des56 cipher %^%#PLACEHOLDER%^%#
#
telnet server enable
http server enable
ssh server compatible-ssh1x enable
ssh server cipher aes128_cbc 3des_cbc
ssh server hmac md5 sha1
ssh server key-exchange dh_group1_sha1
#
ike proposal 10
 encryption-algorithm 3des
 authentication-algorithm md5
 dh group2
#
ipsec proposal P10
 esp authentication-algorithm md5
 esp encryption-algorithm des
#
aaa
 local-user admin password irreversible-cipher $1a$PLACEHOLDER$
 local-user ops password cipher %^%#PLACEHOLDER%^%#
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound telnet
#
return
